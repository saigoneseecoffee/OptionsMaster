<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Options Master</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#070b22;--bg:#0f1640;--card:#222c6e;--card2:#2c3888;--gold:#ffc93c;--green:#3ddc84;--red:#ff5d6c;--blue:#59c8ff;--purple:#b98cff;--txt:#f4f6ff;--mut:#a9b3e6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#060920;color:var(--txt);font-family:'Baloo 2',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.3;overscroll-behavior:none}
button{font-family:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
#app{max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;background:radial-gradient(120% 60% at 50% 0%,#2a3aa0 0%,var(--bg) 55%,#0a0f30 100%);position:relative;overflow:hidden}
#app.shake{animation:shake .35s}
@keyframes shake{20%{transform:translate(-6px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(2px,0)}}
#hud{padding:10px 12px 8px;border-bottom:3px solid var(--ink);background:linear-gradient(#2b379a,#1c2670)}
.hudrow{display:flex;align-items:center;gap:6px}
.logo{font-weight:800;font-size:16px;color:var(--gold);text-shadow:0 2px 0 var(--ink);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{background:var(--ink);border-radius:999px;padding:2px 8px;font-weight:700;font-size:13px;white-space:nowrap}
.nw{font-size:30px;font-weight:800;line-height:1;text-shadow:0 3px 0 var(--ink)}
.nw small{font-size:13px;font-weight:700;margin-left:6px}
.sub{font-size:12px;color:var(--mut);font-weight:500}
.xp{height:10px;background:var(--ink);border-radius:9px;overflow:hidden;border:2px solid var(--ink)}
.xp i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ff9f1c);border-radius:9px;transition:width .5s cubic-bezier(.2,1.4,.4,1)}
#view{flex:1;overflow-y:auto;padding:10px 10px 16px;-webkit-overflow-scrolling:touch}
.card{background:linear-gradient(var(--card2),var(--card));border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);padding:10px 12px;margin-bottom:12px}
.card h3{margin:0 0 6px;font-size:16px;font-weight:800;color:var(--gold)}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.up{color:var(--green)}.dn{color:var(--red)}.mut{color:var(--mut)}.gold{color:var(--gold)}
.big{font-size:19px;font-weight:800}
.tk{width:48px;height:46px;border-radius:13px;border:3px solid var(--ink);display:grid;place-items:center;font-weight:800;font-size:11.5px;box-shadow:0 3px 0 var(--ink);color:var(--ink);flex:none}
.stock{display:flex;align-items:center;gap:9px;width:100%;text-align:left}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:8px;padding:1px 7px;border:2px solid var(--ink);background:var(--ink);white-space:nowrap}
.tag.e{background:var(--purple);color:var(--ink)}.tag.g{background:var(--green);color:var(--ink)}.tag.r{background:var(--red);color:var(--ink)}.tag.y{background:var(--gold);color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);padding:8px 14px;font-weight:800;font-size:15px;background:var(--gold);color:var(--ink);min-height:44px;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
.btn.g{background:var(--green)}.btn.r{background:var(--red)}.btn.b{background:var(--blue)}.btn.d{background:#3a479c;color:var(--txt)}
.btn.sm{min-height:36px;padding:4px 10px;font-size:13px;border-radius:11px}
.btn.w{width:100%}
.btn[disabled]{opacity:.45;filter:grayscale(.6)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:3px solid var(--ink);border-radius:12px;padding:5px 9px;font-weight:700;font-size:13px;background:#34409a;box-shadow:0 3px 0 var(--ink);min-height:38px}
.chip.on{background:var(--gold);color:var(--ink)}
.chip.lock{opacity:.5}
.chip small{font-weight:500;font-size:11px}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sgrid .chip{padding:6px 2px;font-size:11px;line-height:1.15;display:flex;flex-direction:column;align-items:center;gap:1px}
.sgrid .chip b{font-size:18px;line-height:1}
.step{display:flex;align-items:center;gap:6px}
.step button{width:40px;height:40px;border-radius:12px;border:3px solid var(--ink);background:var(--blue);color:var(--ink);font-size:22px;font-weight:800;box-shadow:0 3px 0 var(--ink)}
.step button:active{transform:translateY(3px);box-shadow:none}
.step .v{min-width:70px;text-align:center;font-weight:800;font-size:18px}
.lbl{font-size:12px;color:var(--mut);font-weight:700;margin:8px 0 4px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.kv div{background:var(--ink);border-radius:10px;padding:5px 8px}
.kv span{display:block;font-size:11px;color:var(--mut);font-weight:700}
.kv b{font-size:15px}
canvas.ch{width:100%;height:170px;display:block;border-radius:12px;background:#0a0f30;border:3px solid var(--ink)}
.bubble{display:flex;gap:8px;align-items:flex-start;margin:8px 0}
.bubble svg{width:52px;height:52px;flex:none}
.bubble p{margin:0;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:14px 14px 14px 4px;padding:6px 10px;font-size:13.5px;font-weight:700;line-height:1.25;box-shadow:0 3px 0 var(--ink)}
.chain{display:grid;grid-template-columns:1fr 34px 58px 34px 1fr;gap:3px;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
.chain>*{background:var(--ink);border-radius:7px;padding:5px 2px;text-align:center;min-height:32px;display:grid;place-items:center}
.chain .hd{background:none;color:var(--mut);font-size:10.5px;min-height:0;padding:0}
.chain .k{background:#3a479c;font-weight:800;font-size:13.5px}
.chain .k.atm{background:var(--gold);color:var(--ink)}
.chain .itm{background:#1d3a5e}
.chain .selc{outline:3px solid var(--gold)}
.chain .dl{color:var(--mut);font-size:11px;background:none}
#bar{display:flex;gap:8px;padding:8px 10px;background:#141b52;border-top:3px solid var(--ink)}
#tabs{display:flex;background:var(--ink);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
#tabs button{flex:1;padding:5px 0 3px;font-size:11px;font-weight:700;color:var(--mut);border-radius:10px;position:relative}
#tabs button b{display:block;font-size:20px;line-height:1.1}
#tabs button.on{background:#2b379a;color:var(--gold)}
#tabs .dot{position:absolute;top:3px;right:22%;width:10px;height:10px;border-radius:9px;background:var(--red);border:2px solid var(--ink)}
#toasts{position:fixed;left:50%;top:8px;transform:translateX(-50%);width:min(94vw,450px);z-index:50;pointer-events:none;display:flex;flex-direction:column;gap:6px}
.toast{background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);padding:7px 12px;font-weight:700;font-size:13.5px;line-height:1.25;animation:tin .35s cubic-bezier(.2,1.5,.4,1),tout .3s 4.6s forwards}
.toast.g{background:var(--green)}.toast.r{background:var(--red)}.toast.y{background:var(--gold)}
@keyframes tin{from{transform:translateY(-40px) scale(.8);opacity:0}}
@keyframes tout{to{transform:translateY(-20px);opacity:0}}
#modal{position:fixed;inset:0;background:rgba(4,6,24,.82);z-index:60;display:none;align-items:center;justify-content:center;padding:16px}
#modal.on{display:flex}
#modal .card{max-width:420px;width:100%;max-height:86dvh;overflow:auto;animation:pop .3s cubic-bezier(.2,1.5,.4,1)}
#modal p{font-size:14.5px;margin:4px 0 10px}
@keyframes pop{from{transform:scale(.7);opacity:0}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:70;width:100%;height:100%}
.pos{border-top:2px dashed #3a479c;padding:8px 0}.pos:first-of-type{border-top:0}
.miss{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:2px dashed #3a479c}.miss:first-of-type{border-top:0}
.miss .ic{width:34px;height:34px;border-radius:10px;border:3px solid var(--ink);display:grid;place-items:center;font-size:16px;background:#3a479c;flex:none}
.miss.done .ic{background:var(--green);color:var(--ink)}.miss.cur .ic{background:var(--gold);color:var(--ink);animation:pulse 1s infinite alternate}
@keyframes pulse{to{transform:scale(1.12)}}
.miss.lockd{opacity:.45}
details{border-top:2px dashed #3a479c;padding:6px 0}details:first-of-type{border-top:0}
summary{font-weight:800;font-size:15px;list-style:none;cursor:pointer}summary::before{content:'▸ ';color:var(--gold)}details[open] summary::before{content:'▾ '}
details p{margin:6px 0 2px;font-size:14px;font-weight:500;color:#dfe4ff}
.news{font-size:13.5px;font-weight:700;padding:3px 0}
.er{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:14px;font-weight:700;background:var(--ink);border-radius:10px;padding:8px 10px;margin:6px 0}
.bump{animation:bump .4s cubic-bezier(.2,1.6,.4,1)}@keyframes bump{from{transform:scale(1.25)}}

.seg{display:flex;gap:4px;background:var(--ink);border-radius:14px;padding:4px;margin-bottom:10px}
.seg button{flex:1;padding:8px 2px;border-radius:10px;font-weight:800;font-size:12.5px;color:var(--mut);min-height:40px}
.seg button.on{background:var(--gold);color:var(--ink)}
.inp{width:100%;font:inherit;font-size:16px;font-weight:700;padding:9px 11px;border-radius:12px;border:3px solid var(--ink);background:#fff;color:var(--ink)}
.sel{font-size:14px;padding:8px 10px;background:#e9edff}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.chips.scroll .chip{flex:none}
.tbl{overflow-x:auto;margin:6px 0}
.tbl table{border-collapse:collapse;width:100%;font-size:12.5px;font-weight:600}
.tbl th,.tbl td{border:2px solid var(--ink);padding:5px 6px;text-align:left;vertical-align:top;background:#1b2462}
.tbl th{background:#2b379a;color:var(--gold);font-weight:800}
.fx{background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:8px 10px;margin:8px 0;font-family:Georgia,'Times New Roman',serif;font-size:14.5px;line-height:1.6;font-weight:700;overflow-x:auto}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.g5 div{background:var(--ink);border-radius:10px;padding:5px 4px;text-align:center}
.g5 span{display:block;font-size:10.5px;color:var(--mut);font-weight:700}
.g5 b{font-size:14px}
.mini3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.mini3 div{background:var(--ink);border-radius:10px;padding:5px 8px}
.mini3 span{display:block;font-size:11px;color:var(--mut);font-weight:700}
.mini3 b{font-size:14px}.mini3 i,.kv i{font-style:normal}
.sech{font-weight:800;color:var(--gold);font-size:14px;margin:4px 4px 6px;text-shadow:0 2px 0 var(--ink)}
.banner{background:var(--gold);color:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:7px 10px;font-weight:700;font-size:13.5px;margin-bottom:8px}
.banner.r{background:var(--red);box-shadow:0 4px 0 var(--ink);margin-bottom:12px}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cin span{display:block;font-size:12px;color:var(--mut);font-weight:700;margin-bottom:2px}
.cin{position:relative;display:block}.cin i{position:absolute;right:10px;bottom:11px;font-style:normal;color:#5a648f;font-weight:700;font-size:13px;pointer-events:none}
.kv .hl.on{background:var(--gold);color:var(--ink)}.kv .hl.on span{color:#3a3a00}
.nm{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tabs .dot.red{animation:pulse .6s infinite alternate}
.btn small{font-size:11px;font-weight:700}
</style>
</head>
<body>
<div id="app">
  <header id="hud"></header>
  <main id="view"></main>
  <div id="bar"></div>
  <nav id="tabs"></nav>
</div>
<div id="toasts"></div>
<div id="modal"></div>
<canvas id="fx"></canvas>
<script>
"use strict";
/* ============ tiện ích ============ */
const $=s=>document.querySelector(s);
const money=(n,d=0)=>(n<0?'-':'')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const sgn=(n,d=0)=>(n>=0?'+':'-')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const pc=(x,d=1)=>(x>=0?'+':'')+(x*100).toFixed(d)+'%';
const cls=n=>n>=0?'up':'dn';
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const pick=a=>a[Math.random()*a.length|0];
const gauss=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
const kf=k=>k%1?(+k.toFixed(2)).toString():''+k;
const r2=x=>Math.round(x*100)/100;
const r4=x=>Math.round(x*1e4)/1e4;
const esc=t=>String(t).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'})[c]);
const shf=n=>(n%1?(+n.toFixed(3)).toString():''+n);

/* ============ ngôn ngữ / language ============ */
let LANG=(()=>{let l=null;try{l=localStorage.getItem('om-lang')}catch(e){}if(l==='vi'||l==='en')return l;return(navigator.language||'').toLowerCase().startsWith('vi')?'vi':'en'})();
const L=(v,e)=>LANG==='en'?e:v;
const LX=o=>o?(Array.isArray(o)?(LANG==='en'?o[1]:o[0]):o):'';
function setLang(l){LANG=l;try{localStorage.setItem('om-lang',l)}catch(e){}document.documentElement.lang=l}

/* ============ lịch giao dịch Mỹ ============ */
const DAYMS=864e5,HOL=['2026-11-26','2026-12-25','2027-01-01','2027-01-18','2027-02-15','2027-03-26','2027-05-31','2027-06-18','2027-07-05','2027-09-06','2027-11-25','2027-12-24','2028-01-17','2028-02-21','2028-04-14','2028-05-29','2028-06-19','2028-07-04','2028-09-04','2028-11-23','2028-12-25'];
const toD=i=>new Date(i+'T00:00:00Z'),iso=d=>d.toISOString().slice(0,10);
const addD=(i,n)=>iso(new Date(toD(i).getTime()+n*DAYMS));
const dow=i=>toD(i).getUTCDay();
const isTD=i=>{const w=dow(i);return w>0&&w<6&&!HOL.includes(i)};
const nextTD=i=>{do i=addD(i,1);while(!isTD(i));return i};
const addTD=(i,n)=>{while(n-->0)i=nextTD(i);return i};
const calDays=(a,b)=>Math.round((toD(b)-toD(a))/DAYMS);
const dm=i=>L(i.slice(8)+'/'+i.slice(5,7),(+i.slice(5,7))+'/'+(+i.slice(8)));
const dfmt=i=>L(['CN','T2','T3','T4','T5','T6','T7'],['Sun','Mon','Tue','Wed','Thu','Fri','Sat'])[dow(i)]+' '+dm(i);
const dfull=i=>dm(i)+'/'+i.slice(2,4);
const adjF=f=>{while(!isTD(f))f=addD(f,-1);return f};
function thirdFri(y,m){let d=y+'-'+String(m).padStart(2,'0')+'-01';while(dow(d)!==5)d=addD(d,1);return addD(d,14)}
function expiries(){const d=S.date,out=[];let f=d;while(dow(f)!==5)f=addD(f,1);if(f<=d)f=addD(f,7);
  for(let i=0;i<4;i++){const a=adjF(addD(f,7*i));if(a>d)out.push(a)}
  const last=out[out.length-1];let y=+d.slice(0,4),m=+d.slice(5,7),n=0;
  for(let k=0;k<8&&n<3;k++){const a=adjF(thirdFri(y,m));if(a>last){out.push(a);n++}if(++m>12){m=1;y++}}
  return out}
const isMonthly=e=>{const t=thirdFri(+e.slice(0,4),+e.slice(5,7));return e===adjF(t)};
function macro(d){const day=+d.slice(8);
  const fed=calDays('2026-12-09',d);if(fed>=0&&fed%42===0)return{k:'FED'};
  let c=d.slice(0,8)+'12';while(!isTD(c))c=addD(c,1);if(c===d)return{k:'CPI'};
  if(dow(d)===5&&day<=7)return{k:'JOBS'};
  if(d.slice(5,7)==='02'||d.slice(5,7)==='05'||d.slice(5,7)==='08'||d.slice(5,7)==='11'){let o=d.slice(0,8)+'01';while(dow(o)!==3)o=addD(o,1);o=addD(o,14);if(o===d)return{k:'OPEC'}}
  return null}
const macroName=k=>({FED:L('Fed công bố lãi suất','Fed rate decision'),CPI:L('Số liệu lạm phát CPI','CPI inflation report'),JOBS:L('Báo cáo việc làm','Jobs report'),OPEC:L('Họp OPEC+ về sản lượng dầu','OPEC+ output meeting')})[k]||k;

/* ============ Black-Scholes (có cổ tức liên tục q) ============ */
function ncdf(x){const t=1/(1+0.2316419*Math.abs(x)),d=0.3989423*Math.exp(-x*x/2);
  const p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return x>0?1-p:p}
const npdf=x=>Math.exp(-x*x/2)/2.5066283;
const RATE=0.04;
/* trả về giá p và Greeks: d (delta), g (gamma), th (theta / ngày lịch), ve (vega / 1% IV), rho (/1% lãi suất) */
function bs(type,S0,K,T,v,q=0,r=RATE){
  if(T<=0||v<=0){const p=Math.max(0,type==='C'?S0-K:K-S0);return{p,d:type==='C'?(S0>K?1:0):(S0<K?-1:0),g:0,th:0,ve:0,rho:0,d1:0,d2:0}}
  const sq=v*Math.sqrt(T),d1=(Math.log(S0/K)+(r-q+v*v/2)*T)/sq,d2=d1-sq,eq=Math.exp(-q*T),er=Math.exp(-r*T),pd=npdf(d1);
  const g=eq*pd/(S0*sq),ve=S0*eq*pd*Math.sqrt(T)/100;
  if(type==='C')return{p:S0*eq*ncdf(d1)-K*er*ncdf(d2),d:eq*ncdf(d1),g,ve,d1,d2,
    th:(-S0*eq*pd*v/(2*Math.sqrt(T))-r*K*er*ncdf(d2)+q*S0*eq*ncdf(d1))/365,rho:K*T*er*ncdf(d2)/100};
  return{p:K*er*ncdf(-d2)-S0*eq*ncdf(-d1),d:eq*(ncdf(d1)-1),g,ve,d1,d2,
    th:(-S0*eq*pd*v/(2*Math.sqrt(T))+r*K*er*ncdf(-d2)-q*S0*eq*ncdf(-d1))/365,rho:-K*T*er*ncdf(-d2)/100};
}

/* ============ dữ liệu: tên và mã thật, giá và tin tức mô phỏng ============ */
const SECT={
 index:['Quỹ chỉ số','Index ETFs'],tech:['Công nghệ','Technology'],consumer:['Tiêu dùng','Consumer'],finance:['Tài chính','Financials'],
 health:['Y tế','Healthcare'],energy:['Năng lượng','Energy'],industrial:['Công nghiệp','Industrials'],utility:['Tiện ích & Thiết yếu','Utilities & Staples'],
 realestate:['Bất động sản','Real Estate'],comm:['Truyền thông','Communication'],bond:['Trái phiếu','Bonds'],cmdty:['Hàng hóa','Commodities']};
/* f: hệ số theo vàng (g) / dầu (o); dy: tỷ suất cổ tức năm; pe: P/E dùng cho EPS */
const DEFS=[
 {sym:'SPY',name:'SPDR S&P 500 ETF Trust',sec:'index',etf:1,px:600,vol:.15,beta:1,liq:.4,col:'#ffffff',dy:.012},
 {sym:'QQQ',name:'Invesco QQQ Trust',sec:'index',etf:1,px:525,vol:.21,beta:1.25,liq:.4,col:'#d9e2ff',dy:.006},
 {sym:'IWM',name:'iShares Russell 2000 ETF',sec:'index',etf:1,px:220,vol:.22,beta:1.2,liq:.6,col:'#c7f0d8',dy:.012},
 {sym:'VYM',name:'Vanguard High Dividend Yield ETF',sec:'index',etf:1,px:130,vol:.13,beta:.75,liq:.8,col:'#ffe3a3',dy:.028},
 {sym:'BND',name:'Vanguard Total Bond Market ETF',sec:'bond',etf:1,px:73,vol:.06,beta:-.1,liq:.6,col:'#b8e3ff',dy:.037},

 [['Yếu tố thời gian','Gần như không mất giá trị theo thời gian','Mất giá trị dần theo thời gian (theta), nhất là gần ngày đáo hạn'],['Time','Almost no time decay','Loses value over time (theta), especially near expiration']],
 [['Biến động (IV)','Không ảnh hưởng trực tiếp','Ảnh hưởng mạnh tới giá quyền chọn (vega)'],['Volatility (IV)','No direct effect','Strongly affects the option price (vega)']]];

const BSF='<div class="fx">C = S·e<sup>−qT</sup>·N(d₁) − K·e<sup>−rT</sup>·N(d₂)<br>P = K·e<sup>−rT</sup>·N(−d₂) − S·e<sup>−qT</sup>·N(−d₁)<br>d₁ = [ln(S/K) + (r − q + σ²/2)·T] / (σ·√T)<br>d₂ = d₁ − σ·√T</div>';
const LESS=[
 {h:['🎯 Quyền chọn: nền tảng','🎯 Options: the basics'],items:[
  [['Quyền chọn là gì?','Là hợp đồng cho bạn QUYỀN (không bắt buộc) mua hoặc bán 100 cổ phiếu ở một mức giá định sẵn (strike) trước ngày đáo hạn. Bạn trả một khoản phí gọi là premium để có quyền đó.'],['What is an option?','A contract that gives you the RIGHT (not the obligation) to buy or sell 100 shares at a set price (the strike) before the expiration date. You pay a fee called the premium for that right.']],
  [['Call và Put','Call = quyền MUA; tăng giá khi cổ phiếu tăng. Put = quyền BÁN; tăng giá khi cổ phiếu giảm. Người mua lỗ tối đa bằng premium; người bán thu premium nhưng gánh nghĩa vụ.'],['Calls and Puts','Call = the right to BUY; it gains when the stock rises. Put = the right to SELL; it gains when the stock falls. Buyers can lose at most the premium; sellers collect it but carry the obligation.']],
  [['ITM, ATM, OTM','ITM: đang có giá trị nội tại (Call có strike dưới giá). ATM: strike sát giá. OTM: chưa có giá trị nội tại — rẻ, đòn bẩy cao nhưng dễ về 0.'],['ITM, ATM, OTM','ITM: has intrinsic value (a Call with its strike below the price). ATM: strike near the price. OTM: no intrinsic value yet — cheap and leveraged, but often expires at zero.']],
  [['Premium = nội tại + thời gian','Giá trị nội tại là phần "đang lời nếu thực hiện ngay". Phần còn lại là giá trị thời gian — nó tan dần về 0 khi tới ngày đáo hạn. Máy tính quyền chọn trong tab Giao dịch tách hai phần này cho bạn xem.'],['Premium = intrinsic + time value','Intrinsic value is what you would make by exercising right now. The rest is time value, which melts to zero by expiration. The options calculator in the Trade tab splits the two for you.']],
  [['Bid, Ask và phí','Bạn MUA ở giá Ask và BÁN ở giá Bid. Khoảng chênh là chi phí ẩn: vừa mở lệnh là đã âm một chút. Mã ít thanh khoản và strike xa có chênh lệch rộng hơn. Phí $0.65 mỗi hợp đồng mỗi chân.'],['Bid, Ask and fees','You BUY at the Ask and SELL at the Bid. That gap is a hidden cost: every trade starts slightly red. Thin stocks and far strikes have wider spreads. Fees are $0.65 per contract per leg.']],
  [['Ngày đáo hạn','Quyền chọn cổ phiếu Mỹ thường đáo hạn vào thứ Sáu. Kỳ hạn tuần ngắn và rẻ; kỳ hạn tháng rơi vào thứ Sáu tuần thứ ba, thanh khoản tốt nhất. Cuối tuần thị trường nghỉ nhưng thời gian vẫn trôi.'],['Expiration dates','US stock options usually expire on Fridays. Weeklies are short and cheap; monthlies land on the third Friday and are the most liquid. Markets close on weekends, but time still passes.']]]},
 {h:['🧮 Black–Scholes & Greeks','🧮 Black–Scholes & the Greeks'],items:[
  [['Công thức Black–Scholes',`Game định giá mọi quyền chọn bằng mô hình Black–Scholes (có cổ tức liên tục q):${BSF}S: giá cổ phiếu · K: strike · T: thời gian còn lại (năm) · r: lãi suất phi rủi ro (4%) · q: tỷ suất cổ tức · σ: biến động (IV) · N(): phân phối chuẩn tích lũy. N(d₂) xấp xỉ xác suất Call kết thúc ITM.`],['The Black–Scholes formula',`The game prices every option with Black–Scholes (with a continuous dividend yield q):${BSF}S: stock price · K: strike · T: time left (years) · r: risk-free rate (4%) · q: dividend yield · σ: volatility (IV) · N(): cumulative normal distribution. N(d₂) roughly equals the odds a Call finishes ITM.`]],
  [['Giả định & giới hạn của mô hình','Black–Scholes giả định biến động không đổi, giá đi theo phân phối log-chuẩn và không nhảy vọt. Thực tế giá có cú nhảy (báo cáo lợi nhuận) và IV mỗi strike mỗi khác (skew) — vì thế thị trường dùng "IV ngụ ý" từng strike thay vì một σ duy nhất.'],['Assumptions & limits','Black–Scholes assumes constant volatility, log-normal prices and no jumps. Real prices jump (earnings) and IV differs by strike (skew) — so the market quotes an implied volatility for each strike instead of one σ.']],
  [['Delta (Δ)','Quyền chọn đổi bao nhiêu khi cổ phiếu tăng $1. Call: 0 → 1, Put: −1 → 0. Delta 0.50 ≈ 50 cổ phiếu cho mỗi hợp đồng. Cũng là xác suất xấp xỉ kết thúc ITM.'],['Delta (Δ)','How much the option moves when the stock rises $1. Calls: 0 → 1, Puts: −1 → 0. A 0.50 delta behaves like 50 shares per contract. It is also a rough probability of finishing ITM.']],
  [['Gamma (Γ)','Delta đổi bao nhiêu khi cổ phiếu tăng $1. Gamma lớn nhất ở ATM và sát ngày đáo hạn: vị thế đổi chiều rất nhanh. Người mua có gamma dương (có lợi khi giá chạy mạnh), người bán gamma âm.'],['Gamma (Γ)','How much delta changes when the stock rises $1. Highest at the money and near expiry, where positions swing fast. Buyers are long gamma (they like big moves); sellers are short gamma.']],
  [['Theta (Θ)','Số tiền quyền chọn mất mỗi ngày lịch khi mọi thứ đứng yên. Tăng tốc mạnh trong 30 ngày cuối. Người mua trả theta, người bán hưởng theta.'],['Theta (Θ)','What the option loses per calendar day if nothing else changes. It speeds up sharply in the last 30 days. Buyers pay theta; sellers earn it.']],
  [['Vega (ν)','Số tiền quyền chọn đổi khi IV đổi 1 điểm %. Kỳ hạn dài có vega lớn. Người mua có lợi khi IV tăng, người bán có lợi khi IV giảm — đó là lý do "IV crush" sau báo cáo lợi nhuận làm người mua thua.'],['Vega (ν)','What the option gains or loses when IV moves 1 point. Longer expiries carry more vega. Buyers like rising IV, sellers like falling IV — which is why the post-earnings IV crush hurts buyers.']],
  [['Rho (ρ)','Số tiền quyền chọn đổi khi lãi suất tăng 1%. Call có rho dương, Put rho âm. Thường nhỏ, chỉ đáng kể với kỳ hạn dài (LEAPS).'],['Rho (ρ)','What the option gains when interest rates rise 1%. Calls have positive rho, Puts negative. Usually small; it matters mostly for long-dated LEAPS.']],
  [['Put–Call Parity','Với cùng strike và kỳ hạn: C − P = S·e<sup>−qT</sup> − K·e<sup>−rT</sup>. Nếu đẳng thức này lệch, có cơ hội arbitrage. Máy tính quyền chọn kiểm tra đẳng thức này cho bạn.'],['Put–Call Parity','For the same strike and expiry: C − P = S·e<sup>−qT</sup> − K·e<sup>−rT</sup>. If it breaks, there is an arbitrage. The options calculator checks it for you.']],
  [['IV, IV Rank và skew','IV cao thì premium đắt. IV Rank so IV hiện tại với chính nó 60 phiên qua: gần 100 là đắt (lợi cho người bán), gần 0 là rẻ (lợi cho người mua). Put OTM thường có IV cao hơn Call OTM (skew) vì nhà đầu tư trả đắt để mua bảo hiểm giảm giá.'],['IV, IV Rank and skew','High IV means pricey premiums. IV Rank compares today\'s IV with the last 60 sessions: near 100 is expensive (good for sellers), near 0 is cheap (good for buyers). OTM Puts usually carry higher IV than OTM Calls (skew) because investors pay up for crash insurance.']]]},
 {h:['🧩 Chiến lược quyền chọn','🧩 Options strategies'],items:[
  [['Spread dọc (vertical)','Spread trả tiền (Bull Call, Bear Put) là cược hướng với chi phí thấp, lãi có trần. Spread thu tiền (Bull Put, Bear Call) là bán premium với lỗ tối đa biết trước = độ rộng − premium thu.'],['Vertical spreads','Debit spreads (Bull Call, Bear Put) are cheaper directional bets with capped profit. Credit spreads (Bull Put, Bear Call) sell premium with a known max loss = width − credit.']],
  [['Iron Condor & Iron Butterfly','Iron Condor = Bull Put + Bear Call: thắng khi giá nằm trong vùng giữa hai strike bán. Iron Butterfly đặt hai strike bán chung một chỗ: thu nhiều hơn nhưng vùng thắng hẹp hơn.'],['Iron Condor & Iron Butterfly','An Iron Condor is a Bull Put plus a Bear Call: it wins while price stays between the short strikes. An Iron Butterfly puts both short strikes at one price: more credit, narrower sweet spot.']],
  [['Straddle & Strangle','Mua cả Call và Put để cược giá chạy MẠNH. Straddle cùng strike (đắt), Strangle hai strike OTM (rẻ hơn, cần chạy xa hơn). Kẻ thù: giá đi ngang và IV crush.'],['Straddles & Strangles','Buy both a Call and a Put to bet on a BIG move. A Straddle uses one strike (pricey); a Strangle uses two OTM strikes (cheaper, needs a bigger move). Enemies: a flat stock and IV crush.']],
  [['Butterfly','Mua 1 Call thấp, bán 2 Call giữa, mua 1 Call cao. Chi phí rất nhỏ, lãi tối đa khi giá đáo hạn đúng strike giữa. Dùng khi bạn có mục tiêu giá cụ thể.'],['Butterfly','Buy a low Call, sell two middle Calls, buy a high Call. Very cheap, with max profit if the stock expires at the middle strike. Use it when you have a precise price target.']],
  [['Covered Call, Protective Put, Collar & Wheel','Covered Call: giữ 100 cp, bán Call lấy thu nhập. Protective Put: giữ cp, mua Put làm bảo hiểm. Collar: cả hai cùng lúc, khóa lãi/lỗ trong một vùng. Wheel: bán Cash-Secured Put → bị giao cp → bán Covered Call → lặp lại.'],['Covered Call, Protective Put, Collar & the Wheel','Covered Call: hold 100 shares, sell a Call for income. Protective Put: hold shares, buy a Put as insurance. Collar: both at once, locking P&L in a range. The Wheel: sell Cash-Secured Puts → get assigned → sell Covered Calls → repeat.']],
  [['Báo cáo lợi nhuận & "expected move"','Trước báo cáo, giá straddle ATM cho biết thị trường đang định giá cú nhảy bao nhiêu %. Sau báo cáo phần IV "sự kiện" biến mất (IV crush). Mua quyền chọn qua báo cáo chỉ lời khi giá nhảy MẠNH HƠN mức đã định giá.'],['Earnings & the "expected move"','Before a report, the ATM straddle price tells you the move the market is pricing in. Afterwards the event premium vanishes (IV crush). Buying options through earnings only pays if the stock moves MORE than what was priced in.']],
  [['Vì sao lãi vượt kỳ vọng mà giá vẫn giảm?','Giá phản ứng với tương lai: dự báo (guidance) bị hạ, doanh thu hụt, hoặc cổ phiếu đã chạy mạnh trước báo cáo nên tin tốt nằm sẵn trong giá. Mỗi báo cáo trong game có EPS, doanh thu và guidance — hãy đọc cả ba.'],['Why can a stock fall after beating earnings?','Prices react to the future: guidance gets cut, revenue misses, or the stock ran up before the report so the good news was priced in. Every report in the game shows EPS, revenue and guidance — read all three.']]]},
 {h:['📜 Hợp đồng tương lai (futures)','📜 Futures'],items:[
  [['Future khác options thế nào?',`Ý cốt lõi: <b>future là nghĩa vụ, options là quyền.</b>{FVO}`],['How do futures differ from options?',`The core idea: <b>a future is an obligation, an option is a right.</b>{FVO}`]],
  [['Hợp đồng micro trong game','MES (Micro E-mini S&P 500, $5/điểm), MNQ (Micro E-mini Nasdaq-100, $2/điểm), MGC (Micro Vàng, 10 oz), MCL (Micro Dầu thô, 100 thùng). Mã như MESH7 = MES, tháng 3 (H), năm 2027. Mã tháng: F G H J K M N Q U V X Z = tháng 1 → 12.'],['Micro contracts in the game','MES (Micro E-mini S&P 500, $5/point), MNQ (Micro E-mini Nasdaq-100, $2/point), MGC (Micro Gold, 10 oz), MCL (Micro Crude Oil, 100 barrels). A code like MESH7 = MES, March (H), 2027. Month codes: F G H J K M N Q U V X Z = January → December.']],
  [['Ký quỹ ban đầu & duy trì','Mở lệnh phải đặt ký quỹ ban đầu (khoảng 5–10% giá trị hợp đồng). Đó là tiền đặt cọc, không phải phí. Đòn bẩy 10–20 lần: giá đi 1% có thể làm tài khoản đi 10–20%.'],['Initial & maintenance margin','Opening a contract requires initial margin (about 5–10% of its value). It is a deposit, not a fee. Leverage is 10–20×: a 1% move can swing your account 10–20%.']],
  [['Mark-to-market & margin call','Cuối mỗi phiên, lãi/lỗ được cộng/trừ thẳng vào tiền mặt. Nếu tiền mặt âm, bạn bị gọi ký quỹ (margin call): phải bán bớt tài sản hoặc đóng vị thế trước phiên sau. Không xử lý thì sàn tự đóng vị thế — và bạn vẫn có thể lỗ nhiều hơn số đã ký quỹ.'],['Mark-to-market & margin calls','After every session, P&L is credited or debited straight to cash. If cash goes negative you get a margin call: sell something or close positions before the next session. Ignore it and the broker liquidates you — and you can still lose more than your margin.']],
  [['Basis, contango & roll','Giá future = giá giao ngay × e^(chi phí nắm giữ × T). Chỉ số: lãi suất trừ cổ tức. Dầu thường ở trạng thái contango (kỳ hạn xa đắt hơn). Muốn giữ vị thế lâu phải "roll": đóng hợp đồng gần đáo hạn, mở hợp đồng kỳ sau. Game thanh toán bằng tiền khi đáo hạn; dầu thật giao hàng vật chất nên trader luôn roll trước hạn.'],['Basis, contango & the roll','Futures price = spot × e^(cost of carry × T). Indexes: interest rate minus dividends. Oil is often in contango (later months cost more). To hold longer you "roll": close the expiring contract and open the next one. The game cash-settles at expiry; real oil is physically delivered, so traders always roll first.']],
  [['Dùng future để làm gì?','Phòng hộ: chủ danh mục cổ phiếu bán MES để giảm rủi ro thị trường mà không phải bán cổ phiếu. Đầu cơ: mua/bán vàng, dầu, chỉ số với vốn nhỏ. Cả hai đều cần quản trị ký quỹ cẩn thận.'],['What are futures for?','Hedging: a stock investor sells MES to cut market risk without selling shares. Speculation: trade gold, oil or indexes with little capital. Both need careful margin management.']]]},
 {h:['🌱 Đầu tư dài hạn & ngắn hạn','🌱 Long-term vs short-term'],items:[
  [['Đầu tư hay giao dịch?','Giao dịch ngắn hạn: giữ vài ngày tới vài tuần, kiếm lời từ biến động, cần theo dõi sát và chịu nhiều phí. Đầu tư dài hạn: giữ nhiều năm, hưởng tăng trưởng doanh nghiệp và cổ tức, ít phải làm gì. Danh mục trong game gắn nhãn từng lô: dưới 1 năm là ngắn hạn, từ 1 năm là dài hạn.'],['Investing or trading?','Short-term trading: hold days to weeks, profit from swings, watch closely and pay more costs. Long-term investing: hold for years, earn business growth and dividends, do little. The portfolio tags each lot: under 1 year is short-term, 1 year or more is long-term.']],
  [['Thuế theo thời gian nắm giữ (Mỹ)','Ở Mỹ, lãi từ tài sản giữ dưới 1 năm bị đánh thuế như thu nhập thường; giữ từ 1 năm trở lên hưởng thuế suất lãi vốn dài hạn thấp hơn (0/15/20%). Game không tính thuế, nhưng nhãn ngắn/dài hạn giúp bạn quen với khái niệm này. Đây không phải tư vấn thuế.'],['Holding-period taxes (US)','In the US, gains on assets held under a year are taxed as ordinary income; holding a year or more gets lower long-term capital-gains rates (0/15/20%). The game does not tax you, but the short/long-term tags teach the idea. This is not tax advice.']],
  [['Đầu tư định kỳ (DCA)','Mỗi tháng mua một số tiền cố định, bất kể giá. Giá thấp thì mua được nhiều cổ phần hơn, giá cao thì ít hơn — giá vốn bình quân tự được làm mượt, và bạn không phải đoán đáy. Game cho phép mua lẻ cổ phần (fractional) cho kế hoạch định kỳ.'],['Dollar-cost averaging (DCA)','Invest a fixed amount every month regardless of price. Low prices buy more shares, high prices fewer — your average cost smooths out and you never have to time the bottom. Monthly plans in the game can buy fractional shares.']],
  [['Cổ tức & tái đầu tư (DRIP)','Cổ phiếu/ETF có cổ tức trả mỗi quý vào ngày chốt quyền; giá cổ phiếu giảm đúng bằng khoản cổ tức ngày hôm đó. Bật DRIP để tự động mua thêm cổ phần bằng cổ tức — lãi kép theo thời gian.'],['Dividends & reinvestment (DRIP)','Dividend payers pay every quarter on the ex-date, and the share price drops by the dividend that day. Turn on DRIP to automatically buy more shares with dividends — compounding over time.']],
  [['Đa dạng hóa theo ngành','Không dồn hết vào một ngành: công nghệ và xe điện rung mạnh (beta cao), tiện ích và thực phẩm ổn định (beta thấp), trái phiếu thường đi ngược cổ phiếu khi thị trường hoảng loạn, vàng là nơi trú ẩn. ETF chỉ số cho bạn cả trăm công ty trong một lệnh.'],['Diversify across sectors','Don\'t put everything in one sector: tech and EVs swing hard (high beta), utilities and food are steady (low beta), bonds often move against stocks in a panic, and gold is a safe haven. An index ETF gives you hundreds of companies in one trade.']],
  [['Lãi kép','$10,000 tăng 8%/năm thành khoảng $21,600 sau 10 năm và $46,600 sau 20 năm. Thời gian trên thị trường quan trọng hơn canh thời điểm vào thị trường.'],['Compounding','$10,000 growing 8% a year becomes about $21,600 in 10 years and $46,600 in 20. Time in the market beats timing the market.']]]},
 {h:['🛡️ Quản trị rủi ro & giới hạn của game','🛡️ Risk & game limits'],items:[
  [['Quản trị vốn','Nhiều nhà giao dịch chỉ đặt 2–5% tài khoản cho mỗi lệnh mua quyền chọn, vì một lệnh có thể mất 100%. Với future, hãy tính lỗ khi giá đi ngược 5% trước khi vào lệnh. Cháy tài khoản thường do đi lệnh quá to, không phải do sai hướng.'],['Position sizing','Many traders risk only 2–5% of the account on each long option, since any trade can go to zero. With futures, work out the loss on a 5% adverse move before entering. Accounts usually blow up from oversized bets, not from being wrong on direction.']],
  [['Sự kiện vĩ mô','Fed, CPI, báo cáo việc làm làm cả thị trường rung mạnh. Họp OPEC+ làm giá dầu nhảy. Cổ phiếu beta cao rung mạnh hơn chỉ số; beta thấp rung ít hơn.'],['Macro events','Fed decisions, CPI and jobs reports shake the whole market. OPEC+ meetings move oil. High-beta stocks swing harder than the index; low-beta ones swing less.']],

/* ============ mô phỏng thị trường ============ */
function newStock(d){return{sym:d.sym,px:d.px,prev:d.px,vol:d.vol,beta:d.beta||0,g:d.g||0,o:d.o||0,liq:d.liq||1,etf:d.etf||0,dy:d.dy||0,drift:0,regLeft:0,ivn:0,vs:1,earn:null,divIn:5+Math.random()*58|0,eps:d.pe?d.px/d.pe/4:0,last:null,hist:[],cl:[],ivh:[],lev:d.lev||null,r:0}}
function newGame(reason){
  const old=S&&S.gid?{gid:S.gid,reason:reason||'restart',nw:Math.round(netWorth()),day:S.day,date:S.date,cash:Math.round(S.cash),trades:S.ntr||0,wins:S.wins,losses:S.losses,fees:Math.round(S.fees*100)/100,lv:level(),missions:S.m}:null,gno=(S&&S.gno||0)+1,keepDrip=S?S.drip:false;
  S={v:VER,day:1,date:'2026-11-13',cash:10000,mk:{vol:.15,drift:.1,regLeft:20,ret:0},st:{},sh:{},pos:[],fut:[],dca:[],divs:0,drip:keepDrip,mcall:false,hist:[],xp:0,m:0,news:[],pid:1,wins:0,losses:0,fees:0,intro:false,lang:LANG,gid:uid(),gno,greason:reason||'first',gstart:'2026-11-13',ntr:0,over:false};
  for(const c of CMD)S.st[c.sym]=Object.assign(newStock(c),{cmd:1,beta:0});
  for(const d of DEFS)S.st[d.sym]=newStock(d);
  const all=Object.values(S.st);
  for(let i=0;i<260;i++){const m=stepMarket(null),cm=stepCmd(null);for(const s of all)if(!s.cmd)stepStock(s,m,cm,null);if(i>=200)for(const s of all)if(!s.cmd)s.ivh.push(r4(iv30(s)))}
  /* đưa giá về đúng mức khởi điểm, giữ nguyên hình dạng lịch sử */
  for(const d of DEFS.concat(CMD)){const s=S.st[d.sym],k=d.px/s.px;s.px=r2(s.px*k);s.prev=r2(s.prev*k);s.cl=s.cl.map(v=>r2(v*k))}
  const stocks=DEFS.filter(d=>!d.etf);stocks.sort(()=>Math.random()-.5).forEach((d,i)=>{const s=S.st[d.sym];s.eps=s.px/d.pe/4;s.earn=addTD(S.date,3+Math.round(i*58/stocks.length)+(Math.random()*3|0))});

}
function stepMarket(ev){const mk=S.mk;if(--mk.regLeft<=0){mk.drift=pick([-0.35,-0.1,0.08,0.12,0.2,0.3]);mk.regLeft=15+Math.random()*30|0}
  let z=gauss();if(Math.random()<0.03)z*=2.5;if(ev&&ev.k!=='OPEC')z*=ev.k==='FED'?2.2:1.7;
  const r=mk.drift/252+mk.vol/15.87*z;
  mk.vol=clamp(mk.vol+0.12*(0.15-mk.vol)+(r<0?-r*1.6:-r*0.5)+gauss()*0.004,0.09,0.6);mk.ret=r;return r}
/* hàng hóa: vàng hơi ngược chiều thị trường khi hoảng loạn, dầu theo kinh tế + OPEC */
function stepCmd(ev){const out={};const mret=S.mk.ret;
  for(const c of CMD){const s=S.st[c.sym];if(!s)continue;let z=gauss();if(Math.random()<0.02)z*=2.5;
    let r=c.sym==='GOLD'?0.05/252-0.15*mret+s.vol/15.87*z:0.02/252+0.35*mret+s.vol/15.87*z;
    if(ev&&ev.k==='OPEC'&&c.sym==='OIL')r+=gauss()*0.035;
    const p0=s.px,cc=Math.max(1,p0*(1+r));s.prev=p0;s.px=r2(cc);s.cl.push(s.px);if(s.cl.length>260)s.cl.shift();
    out[c.sym]=r}
  return out}
function earnings(s,date){const est=s.eps,sur=0.04+gauss()*0.07,rev=0.004+gauss()*0.018,dsg=Math.sign(s.drift),r=Math.random(),pr=0.28+0.2*dsg,pcut=0.2-0.12*dsg;
  const guid=r<pr?1:r<pr+pcut?-1:0,run=(s.px/s.cl[Math.max(0,s.cl.length-21)]-1)/(s.vol*0.28),EM=s.vol*0.19;
  const score=0.35*sur/0.07+0.35*rev/0.018+guid-0.45*run+gauss()*0.55,move=clamp(score*0.75,-2.6,2.6)*EM;
  s.eps=est*(1.02+guid*0.03);s.earn=addTD(date,62+(Math.random()*4|0));
  return s.last={date,est,act:est*(1+sur),sur,rev,guid,run,move}}
function stepStock(s,mret,cm,date){
  const p0=s.px;let er=null,ret;
  if(s.lev){const u=S.st[s.lev.u];ret=clamp(s.lev.x*(u.r||0)-0.0095/252,-0.95,3);s.r=ret;s.prev=p0;s.px=Math.max(0.01,r2(p0*(1+ret)));s.cl.push(s.px);if(s.cl.length>260)s.cl.shift();
    s.ivn=u.ivn;s.vs=u.vs;s.dv=null;return null}
  if(!s.etf&&--s.regLeft<=0){s.drift=pick([-0.6,-0.3,0,0,0.25,0.45,0.7])*s.vol/0.35;s.regLeft=10+Math.random()*20|0}
  let zi=gauss();if(Math.random()<0.02)zi*=2.8;
  const fac=s.beta*mret+s.g*(cm.GOLD||0)+s.o*(cm.OIL||0),sys=Math.sqrt((s.beta*.15)**2+(s.g*.15)**2+(s.o*.34)**2);
  const idio=Math.sqrt(Math.max(.0004,s.vol*s.vol-sys*sys));
  ret=fac+(s.etf?0:s.drift/252)+idio*(s.etf?1:s.vs)/15.87*zi;
  if(s.sym==='BND')ret+=0.035/252;
  if(s.sym==='TLT')ret+=0.03/252;
  if(date&&s.earn===date){er=earnings(s,date);ret=er.move+s.beta*mret;er.ret=ret}
  s.r=ret;
  if(!s.etf)s.vs=clamp(0.9*s.vs+0.1*Math.abs(zi)*1.25,0.6,1.9);
  let c=Math.max(0.5,p0*(1+ret));
  let dv=null;if(s.dy>0&&--s.divIn<=0){dv=r2(p0*s.dy/4);c=Math.max(0.5,c-dv);s.divIn=63}
  s.prev=p0;s.px=r2(c);s.cl.push(s.px);if(s.cl.length>260)s.cl.shift();
  s.ivn=clamp(s.ivn*0.85+gauss()*0.02+(ret<-0.03?0.05:0),-0.15,0.3);s.dv=dv;return er}
function ivAt(s,K,exp){const T0=Math.max(calDays(S.date,exp),0.5)/365,lr=s.vol*1.06,stress=S.mk.vol/0.15-1;
  const cur=lr*(0.55+0.45*s.vs)*(1+s.ivn)*(1+(s.etf?0.8:0.45)*stress);
  let b=lr+(cur-lr)*Math.exp(-T0*5);
  if(s.earn&&s.earn>S.date&&exp>=s.earn){const EM=s.vol*0.19;b=Math.sqrt(b*b+EM*EM/T0)}
  const x=Math.log(K/s.px);return Math.max(0.03,b*clamp(1-(s.g?0.2:0.9)*x+2.5*x*x,0.75,1.9))}
const iv30=s=>ivAt(s,s.px,addD(S.date,30));
function ivRank(s){const a=s.ivh.slice(-60);if(!a.length)return 50;const mn=Math.min(...a),mx=Math.max(...a);return mx-mn<1e-6?50:clamp((iv30(s)-mn)/(mx-mn)*100,0,100)}
function hv20(s){const h=s.cl.slice(-21);let a=[];for(let i=1;i<h.length;i++)a.push(Math.log(h[i]/h[i-1]));if(a.length<2)return 0;const m=a.reduce((x,y)=>x+y,0)/a.length;return Math.sqrt(a.reduce((x,y)=>x+(y-m)**2,0)/(a.length-1)*252)}
const stepOf=px=>px<25?1:px<75?2.5:px<200?5:10;
const atm=s=>{const st=stepOf(s.px);return Math.round(s.px/st)*st};
function expMove(s){if(!s.earn)return null;const e=expiries().find(x=>x>=s.earn);if(!e||calDays(s.earn,e)>8)return null;const K=atm(s),T0=calDays(S.date,e)/365;
  return(bs('C',s.px,K,T0,ivAt(s,K,e),s.dy).p+bs('P',s.px,K,T0,ivAt(s,K,e),s.dy).p)/s.px}
function makeNews(){S.news=[];const pool=DEFS.filter(d=>!d.etf).sort(()=>Math.random()-.5).slice(0,3);
  for(const d of pool){const s=S.st[d.sym];let dir=Math.sign(s.drift);if(Math.random()>0.72)dir=pick([-1,0,1]);
    const k=dir>0?'up':dir<0?'dn':'flat';S.news.push({sym:d.sym,k,i:Math.random()*NEWS[k].length|0,tone:dir})}}
const newsTxt=n=>LX(NEWS[n.k][n.i%NEWS[n.k].length](def(n.sym)));
function events(){const out=[];let d=S.date;for(let i=0;i<32&&out.length<7;i++){d=addD(d,1);if(!isTD(d))continue;const m=macro(d);if(m)out.push({d,t:'🏛️ '+macroName(m.k)});
  for(const x of DEFS){const s=S.st[x.sym];if(s.earn===d)out.push({d,t:'📣 '+x.sym+L(' báo cáo lợi nhuận',' reports earnings')})}
  for(const p of S.fut)if(p.exp===d)out.push({d,t:'📜 '+futCode(p.root,p.exp)+L(' đáo hạn',' expires')})}return out}

/* ============ hợp đồng tương lai: kỳ hạn & giá ============ */
function futExps(root){const f=fdef(root),out=[];let y=+S.date.slice(0,4),m=+S.date.slice(5,7);
  for(let k=0;k<26&&out.length<2;k++){if(f.months.includes(m)){const e=adjF(thirdFri(y,m));if(calDays(S.date,e)>7)out.push(e)}if(++m>12){m=1;y++}}return out}
const futCode=(root,e)=>root+MCODE[+e.slice(5,7)-1]+e.slice(3,4);
const futSpot=f=>S.st[f.und].px*f.k;
function futPx(root,exp,spot){const f=fdef(root),T0=Math.max(0,calDays(S.date,exp))/365,sp=spot==null?futSpot(f):spot;
  const p=sp*Math.exp((RATE-f.q)*T0);return Math.round(p/f.tick)*f.tick}
const futIM=(f,px)=>Math.round(px*f.mult*f.im);
const futMM=(f,px)=>Math.round(px*f.mult*f.mm);

/* ============ định giá chiến lược quyền chọn ============ */
function legsOf(t){const s=S.st[t.sym],st=stepOf(s.px),K=t.K,w=t.w*st,d=t.d*st;
  switch(t.strat){
    case 'call':return[{type:'C',side:1,K}];
    case 'put':return[{type:'P',side:1,K}];
    case 'cc':return[{type:'C',side:-1,K}];
    case 'csp':return[{type:'P',side:-1,K}];
    case 'pp':return[{type:'P',side:1,K}];
    case 'bull':return[{type:'C',side:1,K},{type:'C',side:-1,K:K+w}];
    case 'bear':return[{type:'P',side:1,K},{type:'P',side:-1,K:K-w}];
    case 'bullput':return[{type:'P',side:-1,K},{type:'P',side:1,K:K-w}];
    case 'bearcall':return[{type:'C',side:-1,K},{type:'C',side:1,K:K+w}];
    case 'straddle':return[{type:'C',side:1,K},{type:'P',side:1,K}];
    case 'strangle':return[{type:'P',side:1,K:K-d},{type:'C',side:1,K:K+d}];
    case 'collar':return[{type:'P',side:1,K:K-d},{type:'C',side:-1,K:K+d}];
    case 'condor':return[{type:'P',side:1,K:K-d-w},{type:'P',side:-1,K:K-d},{type:'C',side:-1,K:K+d},{type:'C',side:1,K:K+d+w}];
    case 'ironfly':return[{type:'P',side:1,K:K-w},{type:'P',side:-1,K},{type:'C',side:-1,K},{type:'C',side:1,K:K+w}];
    case 'butterfly':return[{type:'C',side:1,K:K-w},{type:'C',side:-1,K,n:2},{type:'C',side:1,K:K+w}];
  }}
const ln=l=>l.n||1;
const nLegs=legs=>legs.reduce((a,l)=>a+ln(l),0);
function legQ(s,type,K,exp){const T0=calDays(S.date,exp)/365,v=ivAt(s,K,exp),q=bs(type,s.px,K,T0,v,s.dy),half=Math.max(0.01,q.p*0.012*s.liq)+0.005*s.liq;
  return{...q,iv:v,bid:Math.max(0,r2(q.p-half)),ask:Math.max(0.01,r2(q.p+half))}}
function quote(sym,legs,exp,opening){const s=S.st[sym];let net=0,mid=0,d=0,g=0,th=0,ve=0,rho=0,iv=0;
  for(const l of legs){const q=legQ(s,l.type,l.K,exp),k=l.side*ln(l);mid+=k*q.p;
    net+=k*(opening?(l.side>0?q.ask:q.bid):(l.side>0?q.bid:q.ask));d+=k*q.d;g+=k*q.g;th+=k*q.th;ve+=k*q.ve;rho+=k*q.rho;iv+=q.iv/legs.length}
  return{net,mid,d,g,th,ve,rho,iv}}
const withShares=strat=>!!(STR[strat]&&STR[strat].sh);
function payoffFn(strat,legs,net,px0){return ST=>{let v=-net;for(const l of legs)v+=l.side*ln(l)*Math.max(0,l.type==='C'?ST-l.K:l.K-ST);if(withShares(strat))v+=ST-px0;return v}}
function analyse(t){const s=S.st[t.sym],legs=legsOf(t),q=quote(t.sym,legs,t.exp,true),f=payoffFn(t.strat,legs,q.net,s.px);
  const ks=legs.map(l=>l.K).sort((a,b)=>a-b),pts=[0,...ks,s.px*3],vals=pts.map(f);
  const unlimited=f(s.px*3)>f(ks[ks.length-1])+1e-6;
  const be=[];let prev=f(0);for(let i=1;i<=900;i++){const x=s.px*3*i/900,y=f(x);if((prev<0)!==(y<0)){const x0=s.px*3*(i-1)/900;be.push(x0+(x-x0)*(-prev)/(y-prev))}prev=y}
  const m=100*t.qty,st=stepOf(s.px),fee=FEE*nLegs(legs)*t.qty;
  const collat=t.strat==='csp'?t.K*m:['condor','bullput','bearcall','ironfly'].includes(t.strat)?t.w*st*m:0;
  return{legs,q,f,fee,maxGain:unlimited?Infinity:Math.max(...vals)*m,maxLoss:Math.min(...vals)*m,be,collat,need:q.net*m+collat+fee,lockSh:withShares(t.strat)?m:0}}
function markPos(p){const s=S.st[p.sym];let mid=0;for(const l of p.legs)mid+=l.side*ln(l)*legQ(s,l.type,l.K,p.exp).p;return mid}
const posPnl=p=>(markPos(p)-p.entry)*100*p.qty-p.fee;
const futPnl=p=>{const f=fdef(p.root);return p.side*p.qty*f.mult*(futPx(p.root,p.exp)-p.entry)-p.fee};
function netWorth(){let n=S.cash;for(const k in S.sh)n+=S.sh[k].n*S.st[k].px;for(const p of S.pos)n+=markPos(p)*100*p.qty+p.collat;
  for(const p of S.fut){const f=fdef(p.root);n+=p.margin+p.side*p.qty*f.mult*(futPx(p.root,p.exp)-p.last)}return n}
const level=()=>{let l=1;while(S.xp>=LV[l])l++;return l};
const rank=l=>LX(RANK[l]);
const posName=p=>`${p.sym} ${STR[p.strat].n}`;
const legTxt=legs=>legs.map(l=>(l.side>0?'+':'−')+(ln(l)>1?ln(l)+'×':'')+kf(l.K)+l.type).join('  ');
const broke=()=>!S.pos.length&&!S.fut.length&&!Object.keys(S.sh).length&&S.cash<60;
const howTxt=h=>({close:L('đóng','closed'),exp:L('đáo hạn','expired'),liq:L('bị đóng do thiếu ký quỹ','liquidated'),sell:L('bán','sold')})[h]||h;

/* ============ cổ phiếu: lô mua, nắm giữ ngắn/dài hạn ============ */
function addShares(sym,n,px,date){const h=S.sh[sym]||(S.sh[sym]={n:0,avg:0,locked:0,lots:[],divs:0});h.avg=(h.avg*h.n+px*n)/(h.n+n);h.n=r4(h.n+n);h.lots.push({n:r4(n),px:r2(px),d:date||S.date})}
function removeShares(sym,n){const h=S.sh[sym];let left=n,cost=0,long=0;
  while(left>1e-9&&h.lots.length){const lot=h.lots[0],k=Math.min(lot.n,left);cost+=k*lot.px;if(calDays(lot.d,S.date)>=365)long+=k;lot.n=r4(lot.n-k);left=r4(left-k);if(lot.n<=1e-9)h.lots.shift()}
  h.n=r4(h.n-n);if(h.n<=1e-6){delete S.sh[sym];return{cost,long}}h.avg=h.lots.reduce((a,l)=>a+l.n*l.px,0)/h.n;return{cost,long}}
const freeSh=sym=>{const h=S.sh[sym];return h?r4(h.n-h.locked):0};

/* ============ hành động ============ */
function addXp(n){const l0=level();S.xp+=n;const l1=level();if(l1>l0){tlog('level_up',{d:{level:l1}});const un=Object.values(STR).filter(x=>x.lv===l1).map(x=>x.ic+' '+x.n);if(l1===FUT_LV)un.push('📜 '+L('Hợp đồng tương lai','Futures'));
  sfx('lvl');confetti(90);modal(`<h3>🎉 ${L('Lên cấp','Level')} ${l1}: ${rank(l1)}</h3><p>${un.length?L('Mở khóa:','Unlocked:')+'<br><b>'+un.join('<br>')+'</b>':L('Danh hiệu mới cho cao thủ!','A new title for a pro!')}</p><button class="btn w" data-a="closeModal">${L('Tiếp tục','Continue')}</button>`)}}
function fire(ev,o={}){const c=S.m;let ok=false;const nw=netWorth();
  if(c===0)ok=ev==='open'&&o.strat==='call';
  else if(c===1)ok=(ev==='close'||ev==='fut_close')&&o.pnl>0;
  else if(c===2)ok=ev==='stock_buy';
  else if(c===3)ok=ev==='dca';
  else if(c===4)ok=ev==='div';
  else if(c===5)ok=ev==='open'&&o.strat==='put';
  else if(c===6)ok=ev==='open'&&o.strat==='cc';
  else if(c===7)ok=ev==='fut_open';
  else if(c===8)ok=ev==='expire'&&o.worthlessShort;
  else if(c===9)ok=ev==='open'&&['bull','bear','bullput','bearcall'].includes(o.strat);
  else if(c===10)ok=ev==='open'&&(o.strat==='straddle'||o.strat==='strangle')&&o.earnDays!=null&&o.earnDays<=4&&o.covers;
  else if(c===11)ok=(ev==='close'||ev==='expire')&&(o.strat==='condor'||o.strat==='ironfly')&&o.pnl>0;
  else if(c===12)ok=Object.values(S.sh).some(h=>h.lots.some(l=>calDays(l.d,S.date)>=365));
  else if(c===13)ok=nw>=15000;else if(c===14)ok=nw>=25000;else if(c===15)ok=nw>=50000;
  if(ok&&c<MISS.length){S.m++;tlog('mission',{d:{no:c+1,name:MISS[c].t[1]}});toast(L('🏅 Xong nhiệm vụ: ','🏅 Mission complete: ')+LX(MISS[c].t)+'  (+150 XP)','y');sfx('win');confetti(40);addXp(150);if(S.m<MISS.length)fire('tick')}}
function place(){const a=analyse(T),s=S.st[T.sym],x=STR[T.strat];
  if(level()<x.lv)return toast(L(`🔒 Cần cấp ${x.lv} để dùng ${x.n}`,`🔒 ${x.n} unlocks at level ${x.lv}`),'r');
  if(a.lockSh&&freeSh(T.sym)<a.lockSh)return toast(L(`Cần ${a.lockSh} cp ${T.sym} rảnh. Mua ở Giao dịch → Cổ phiếu.`,`You need ${a.lockSh} free ${T.sym} shares. Buy them in Trade → Stocks.`),'r');
  if(a.need>S.cash+1e-6)return toast(L('Không đủ tiền mặt: cần ','Not enough cash: need ')+money(a.need),'r');
  const cx=mktCtx(T.sym);
  S.cash-=a.need;S.fees+=a.fee;if(a.lockSh)S.sh[T.sym].locked+=a.lockSh;
  S.pos.push({id:S.pid++,sym:T.sym,strat:T.strat,legs:a.legs,qty:T.qty,exp:T.exp,entry:a.q.net,fee:a.fee,collat:a.collat,lockSh:a.lockSh,open:S.date});S.ntr=(S.ntr||0)+1;
  tlog('trade',Object.assign(cx,{action:'open',sym:T.sym,strat:x.n,qty:T.qty,legs:legTxt(a.legs),exp:T.exp,dte:calDays(S.date,T.exp),fill:+a.q.net.toFixed(2),dc:a.q.net>=0?'debit':'credit',cash:-r2(a.need),fee:a.fee,
    maxLoss:Math.round(a.maxLoss),maxGain:a.maxGain===Infinity?'inf':Math.round(a.maxGain),be:a.be.map(b=>b.toFixed(2)).join(' / '),collat:a.collat,delta:Math.round(a.q.d*100*T.qty),theta:r2(a.q.th*100*T.qty),vega:r2(a.q.ve*100*T.qty),
    covers:!!(s.earn&&T.exp>=s.earn),riskPct:+(Math.abs(a.maxLoss)/netWorth()*100).toFixed(1),advice:inEN(()=>advise(a)[1].replace(/<[^>]+>/g,''))}));
  sfx('buy');toast(`✅ ${L('Khớp','Filled')} ${x.n} ${T.sym} ×${T.qty} @ ${Math.abs(a.q.net).toFixed(2)} ${a.q.net>=0?'debit':'credit'} · ${L('phí','fee')} ${money(a.fee,2)}`,'g');
  addXp(10);fire('open',{strat:T.strat,earnDays:s.earn?calDays(S.date,s.earn):null,covers:!!(s.earn&&T.exp>=s.earn)});save();render()}
function finish(p,pnl,how){S.pos=S.pos.filter(x=>x!==p);S.fut=S.fut.filter(x=>x!==p);S.hist.unshift({n:p.root?futCode(p.root,p.exp)+' '+(p.side>0?'Long':'Short'):posName(p),pnl,how,d:S.date});if(S.hist.length>25)S.hist.pop();
  if(pnl>0){S.wins++;addXp(Math.min(200,20+pnl/10|0))}else S.losses++}
function closePos(id){const p=S.pos.find(x=>x.id===+id);if(!p)return;const q=quote(p.sym,p.legs,p.exp,false),m=100*p.qty,fee=FEE*nLegs(p.legs)*p.qty,pnl=(q.net-p.entry)*m-p.fee-fee;
  const cx=mktCtx(p.sym);S.cash+=q.net*m+p.collat-fee;S.fees+=fee;if(p.lockSh&&S.sh[p.sym])S.sh[p.sym].locked-=p.lockSh;S.ntr=(S.ntr||0)+1;
  tlog('trade',Object.assign(cx,{action:'close',sym:p.sym,strat:STR[p.strat].n,qty:p.qty,legs:legTxt(p.legs),exp:p.exp,dte:calDays(S.date,p.exp),fill:+q.net.toFixed(2),dc:q.net>=0?'credit':'debit',cash:r2(q.net*m+p.collat-fee),fee,
    pnl:r2(pnl),pnlPct:+(pnl/(Math.abs(p.entry)*m||1)*100).toFixed(1),held:calDays(p.open,S.date),collat:p.collat,delta:Math.round(q.d*m),theta:r2(q.th*m),vega:r2(q.ve*m)}));
  finish(p,pnl,'close');toast(`${pnl>=0?L('💰 Chốt lãi','💰 Profit taken'):L('💸 Cắt lỗ','💸 Loss cut')} ${posName(p)}: ${sgn(pnl)} ${L('(sau phí)','(after fees)')}`,pnl>=0?'g':'r');
  if(pnl>0){sfx('win');confetti(Math.min(120,20+pnl/8))}else{sfx('lose');shake()}
  fire('close',{strat:p.strat,pnl});save();render()}
function settle(p){const s=S.st[p.sym],m=100*p.qty;let val=0;for(const l of p.legs)val+=l.side*ln(l)*Math.max(0,l.type==='C'?s.px-l.K:l.K-s.px);
  let pnl=(val-p.entry)*m-p.fee,msg,K=p.legs[0].K,action='expired';
  if(p.strat==='cc'){const h=S.sh[p.sym];h.locked-=m;
    if(s.px>K){removeShares(p.sym,m);S.cash+=K*m;pnl=-p.entry*m-p.fee;action='called_away';msg=L(`📞 ${p.sym} đóng cửa trên strike ${kf(K)}: ${m} cp bị gọi mua (assigned), giữ premium ${money(pnl)}`,`📞 ${p.sym} closed above the ${kf(K)} strike: ${m} shares called away (assigned), you keep ${money(pnl)} premium`)}
    else msg=L(`⌛ Covered Call ${p.sym} hết hạn vô giá trị — ăn trọn ${money(pnl)}`,`⌛ ${p.sym} Covered Call expired worthless — you keep all ${money(pnl)}`)}
  else if(p.strat==='csp'&&s.px<K){addShares(p.sym,m,K);pnl=-p.entry*m-p.fee;action='assigned';msg=L(`📦 ${p.sym} đóng cửa dưới strike ${kf(K)}: bị giao ${m} cp giá ${kf(K)} (đã giữ premium ${money(pnl)})`,`📦 ${p.sym} closed below the ${kf(K)} strike: you were assigned ${m} shares at ${kf(K)} (premium kept: ${money(pnl)})`)}
  else{S.cash+=val*m+p.collat;if(p.lockSh&&S.sh[p.sym])S.sh[p.sym].locked-=p.lockSh;msg=L(`⌛ ${posName(p)} đáo hạn: ${sgn(pnl)}`,`⌛ ${posName(p)} expired: ${sgn(pnl)}`)}
  tlog('trade',Object.assign(mktCtx(p.sym),{action,sym:p.sym,strat:STR[p.strat].n,qty:p.qty,legs:legTxt(p.legs),exp:p.exp,dte:0,fill:+val.toFixed(2),pnl:r2(pnl),pnlPct:+(pnl/(Math.abs(p.entry)*m||1)*100).toFixed(1),held:calDays(p.open,S.date),collat:p.collat}));
  tel.settled.push(`${p.sym} ${STR[p.strat].n} ${sgn(pnl)}`);
  const short=p.entry<0;finish(p,pnl,'exp');toast(msg,pnl>0?'g':pnl<0?'r':'');
  fire('expire',{strat:p.strat,pnl,worthlessShort:short&&Math.abs(val)<1e-9});return pnl}

/* ---- futures ---- */
function openFut(side){const f=fdef(F.root);if(level()<FUT_LV)return toast(L(`🔒 Hợp đồng tương lai mở ở cấp ${FUT_LV}`,`🔒 Futures unlock at level ${FUT_LV}`),'r');
  if(!futExps(F.root).includes(F.exp))F.exp=futExps(F.root)[0];
  const px=futPx(F.root,F.exp),fill=px+side*f.tick,margin=futIM(f,px)*F.qty,fee=FUTFEE*F.qty;
  if(margin+fee>S.cash+1e-6)return toast(L('Không đủ tiền mặt cho ký quỹ: cần ','Not enough cash for margin: need ')+money(margin+fee),'r');
  S.cash-=margin+fee;S.fees+=fee;
  const cx=mktCtx(f.und);
  S.fut.push({id:S.pid++,root:F.root,exp:F.exp,side,qty:F.qty,entry:fill,last:fill,margin,fee,vm:0,open:S.date});S.ntr=(S.ntr||0)+1;
  tlog('trade',Object.assign(cx,{action:side>0?'buy_future':'sell_future',sym:futCode(F.root,F.exp),strat:'Future',qty:side*F.qty,exp:F.exp,dte:calDays(S.date,F.exp),fill,cash:-r2(margin+fee),fee,collat:margin,delta:side*F.qty*f.mult*f.k,riskPct:+(px*f.mult*F.qty*0.05/netWorth()*100).toFixed(1)}));
  sfx('buy');toast(`✅ ${side>0?L('Mua','Bought'):L('Bán','Sold')} ${F.qty} ${futCode(F.root,F.exp)} @ ${fill.toFixed(2)} · ${L('ký quỹ','margin')} ${money(margin)}`,'g');
  addXp(10);fire('fut_open');save();render()}
function closeFut(id,how){const p=S.fut.find(x=>x.id===+id);if(!p)return;const f=fdef(p.root),px=futPx(p.root,p.exp),exit=how==='liq'?px:px-p.side*f.tick,fee=FUTFEE*p.qty;
  const vm=p.side*p.qty*f.mult*(exit-p.last);S.cash+=vm+p.margin-fee;S.fees+=fee;p.vm+=vm;const pnl=p.side*p.qty*f.mult*(exit-p.entry)-p.fee-fee;
  tlog('trade',Object.assign(mktCtx(f.und),{action:how==='liq'?'liquidated':'close_future',sym:futCode(p.root,p.exp),strat:'Future',qty:p.side*p.qty,exp:p.exp,dte:calDays(S.date,p.exp),fill:exit,cash:r2(vm+p.margin-fee),fee,pnl:r2(pnl),held:calDays(p.open,S.date)}));
  finish(p,pnl,how||'close');
  if(how!=='liq'){toast(`${pnl>=0?L('💰 Chốt lãi','💰 Profit taken'):L('💸 Cắt lỗ','💸 Loss cut')} ${futCode(p.root,p.exp)}: ${sgn(pnl)}`,pnl>=0?'g':'r');if(pnl>0){sfx('win');confetti(30)}else{sfx('lose');shake()}
    if(S.mcall&&S.cash>=0){S.mcall=false;toast(L('✅ Đã hết bị gọi ký quỹ','✅ Margin call cleared'),'g')}fire('fut_close',{pnl});save();render()}
  return pnl}
function settleFutures(date){let tot=0;const msgs=[];
  for(const p of S.fut.slice()){const f=fdef(p.root);
    if(p.exp<=date){const fin=futSpot(f),vm=p.side*p.qty*f.mult*(fin-p.last),pnl=p.side*p.qty*f.mult*(fin-p.entry)-p.fee;S.cash+=vm+p.margin;tot+=vm;
      tlog('trade',Object.assign(mktCtx(f.und),{action:'future_expired',sym:futCode(p.root,p.exp),strat:'Future',qty:p.side*p.qty,exp:p.exp,dte:0,fill:fin,pnl:r2(pnl),held:calDays(p.open,S.date)}));
      tel.settled.push(`${futCode(p.root,p.exp)} ${sgn(pnl)}`);msgs.push(L(`📜 ${futCode(p.root,p.exp)} đáo hạn, thanh toán bằng tiền ở ${fin.toFixed(2)}: ${sgn(pnl)}`,`📜 ${futCode(p.root,p.exp)} expired, cash-settled at ${fin.toFixed(2)}: ${sgn(pnl)}`));finish(p,pnl,'exp')}
    else{const px=futPx(p.root,p.exp),vm=p.side*p.qty*f.mult*(px-p.last);S.cash+=vm;p.vm+=vm;p.last=px;tot+=vm}}
  return{tot,msgs}}
function liquidateAll(){let t=0;for(const p of S.fut.slice())t+=closeFut(p.id,'liq');return t}

/* ---- cổ phiếu & ETF ---- */
function buyStock(sym,n,how){const s=S.st[sym],c=n*s.px;if(n<=0)return false;if(c>S.cash+1e-6){if(how!=='dca'&&how!=='drip')toast(L('Không đủ tiền: cần ','Not enough cash: need ')+money(c),'r');return false}
  tlog('trade',Object.assign(mktCtx(sym),{action:how==='dca'?'dca_buy':how==='drip'?'drip_buy':'buy_shares',sym,strat:def(sym).etf?'ETF':'Stock',qty:r4(n),fill:s.px,cash:-r2(c),riskPct:+(c/netWorth()*100).toFixed(1)}));
  S.cash-=c;addShares(sym,n,s.px);if(!how){S.ntr=(S.ntr||0)+1;sfx('buy');toast(L(`Đã mua ${shf(n)} cp ${sym} giá ${money(s.px,2)}`,`Bought ${shf(n)} ${sym} at ${money(s.px,2)}`),'g');addXp(5);fire('stock_buy');save();render()}return true}
function sellStock(sym,n){const s=S.st[sym],free=freeSh(sym);n=Math.min(n,free);if(n<=1e-6)return toast(L('Không có cp rảnh để bán (có thể đang bị khóa cho quyền chọn)','No free shares to sell (some may be locked by an option)'),'r');
  const r=removeShares(sym,n),pnl=n*s.px-r.cost;S.cash+=n*s.px;S.ntr=(S.ntr||0)+1;
  tlog('trade',Object.assign(mktCtx(sym),{action:'sell_shares',sym,strat:def(sym).etf?'ETF':'Stock',qty:-r4(n),fill:s.px,cash:r2(n*s.px),pnl:r2(pnl),pnlPct:+(pnl/(r.cost||1)*100).toFixed(1),held:r.long>0?365:0}));
  S.hist.unshift({n:`${sym} ${shf(n)} ${L('cp','sh')}${r.long>=n-1e-6?' · '+L('dài hạn','long-term'):r.long>0?' · '+L('hỗn hợp','mixed'):' · '+L('ngắn hạn','short-term')}`,pnl,how:'sell',d:S.date});if(S.hist.length>25)S.hist.pop();
  if(pnl>0)S.wins++;else S.losses++;
  sfx(pnl>=0?'win':'lose');toast(L(`Đã bán ${shf(n)} cp ${sym}: `,`Sold ${shf(n)} ${sym}: `)+sgn(pnl),pnl>=0?'g':'r');save();render()}

/* ============ sang phiên ============ */
function nextDay(quiet){
  if(broke())return gameOver();
  const msgs=[];let stop=false,em=null;
  /* gọi ký quỹ từ phiên trước chưa xử lý → sàn tự đóng vị thế */
  if(S.mcall){if(S.cash<0&&S.fut.length){const t=liquidateAll();stop=true;msgs.push([L(`⚠️ Bị đóng toàn bộ hợp đồng tương lai do không nộp đủ ký quỹ (${sgn(t)})`,`⚠️ All futures liquidated for an unmet margin call (${sgn(t)})`),'r']);tlog('margin_liquidation',{d:{cash:Math.round(S.cash)}})}S.mcall=false}
  const before=netWorth(),prevDate=S.date,date=nextTD(S.date),ev=macro(date);S.date=date;S.day++;tel.settled=[];
  const mret=stepMarket(ev),cm=stepCmd(ev),erl=[];let divTot=0;
  if(ev)msgs.push([`🏛️ ${macroName(ev.k)}: ${ev.k==='OPEC'?L('dầu','oil')+' '+pc(cm.OIL||0):L('thị trường','market')+' '+pc(mret)}`,(ev.k==='OPEC'?cm.OIL:mret)>=0?'g':'r']);
  for(const d of DEFS){const s=S.st[d.sym],er=stepStock(s,mret,cm,date);s.ivh.push(r4(iv30(s)));if(s.ivh.length>60)s.ivh.shift();
    if(er)erl.push(`${d.sym} EPS ${pc(er.sur)} rev ${pc(er.rev)} guide ${er.guid>0?'up':er.guid<0?'down':'flat'} -> ${pc(er.ret)}`);
    if(er){const held=S.pos.some(p=>p.sym===d.sym)||S.sh[d.sym],beat=er.sur>=0,w=whyTxt(er);
      if(held||!quiet)msgs.push([L(`📣 ${d.sym} EPS ${beat?'vượt':'hụt'} ${Math.abs(er.sur*100).toFixed(0)}% → giá ${pc(er.ret)}${w?' vì '+w:''}`,`📣 ${d.sym} EPS ${beat?'beat':'missed'} by ${Math.abs(er.sur*100).toFixed(0)}% → stock ${pc(er.ret)}${w?' because '+w:''}`),er.ret>=0?'g':'r']);if(held){stop=true;em=[d,er]}}
    if(s.dv&&S.sh[d.sym]){const h=S.sh[d.sym],amt=r2(h.n*s.dv);if(amt>0){S.cash+=amt;S.divs+=amt;h.divs=(h.divs||0)+amt;divTot+=amt;
      msgs.push([L(`💵 Cổ tức ${d.sym}: ${money(amt,2)} (${money(s.dv,2)}/cp)`,`💵 ${d.sym} dividend: ${money(amt,2)} (${money(s.dv,2)}/sh)`),'g']);
      if(S.drip)buyStock(d.sym,r4(amt/s.px),'drip');fire('div')}}}
  /* gộp cổ phiếu 1:10 khi giá quỹ đòn bẩy quá thấp (như quỹ thật vẫn làm) */
  for(const d of DEFS)if(d.lev){const s=S.st[d.sym];if(s.px<1&&!S.pos.some(p=>p.sym===d.sym)){s.px=r2(s.px*10);s.prev=r2(s.prev*10);s.cl=s.cl.map(v=>r2(v*10));
    const h=S.sh[d.sym];if(h){h.n=r4(h.n/10);h.avg*=10;h.lots.forEach(l=>{l.n=r4(l.n/10);l.px=r2(l.px*10)})}
    msgs.push([L(`🔀 ${d.sym} gộp cổ phiếu 1:10 (reverse split): giá ×10, số cổ phần ÷10`,`🔀 ${d.sym} 1-for-10 reverse split: price ×10, shares ÷10`),'y']);tlog('reverse_split',{d:{sym:d.sym}})}}
  for(const p of S.pos.slice())if(p.exp<=date){settle(p);stop=true}
  const fs=settleFutures(date);for(const m of fs.msgs){msgs.push([m,'y']);stop=true}
  if(S.fut.length&&S.cash<0){S.mcall=true;stop=true;tlog('margin_call',{d:{cash:Math.round(S.cash)}})}
  /* đầu tư định kỳ: phiên đầu tiên của tháng */
  if(date.slice(5,7)!==prevDate.slice(5,7)&&S.dca.length){for(const p of S.dca){const s=S.st[p.sym];
    if(buyStock(p.sym,r4(p.amt/s.px),'dca'))msgs.push([L(`🔁 Đầu tư định kỳ: mua ${money(p.amt)} ${p.sym}`,`🔁 Monthly plan: bought ${money(p.amt)} of ${p.sym}`),'g']);
    else msgs.push([L(`🔁 Không đủ tiền cho kế hoạch ${p.sym} tháng này`,`🔁 Not enough cash for the ${p.sym} plan this month`),'r'])}}
  if(!expiries().includes(T.exp))pickExp();
  if(!futExps(F.root).includes(F.exp))F.exp=futExps(F.root)[0];
  makeNews();addXp(2);const diff=netWorth()-before;
  {let th=0;for(const p of S.pos)th+=quote(p.sym,p.legs,p.exp,false).th*100*p.qty;
   tlog('day',{nw:Math.round(netWorth()),dpnl:Math.round(diff),cash:Math.round(S.cash),npos:S.pos.length+S.fut.length,shares:Object.keys(S.sh).map(k=>k+':'+shf(S.sh[k].n)).join(' '),theta:Math.round(th),vix:+(iv30(S.st.SPY)*100).toFixed(1),mkt:+(mret*100).toFixed(2),macro:ev?ev.k:'',earn:erl.join(' | '),settled:tel.settled.concat(divTot?['dividends '+r2(divTot)]:[]).join(' | ')})}
  fire('tick');
  if(!quiet){for(const m of msgs)toast(m[0],m[1]);if(diff>before*0.03){sfx('win');confetti(50)}else if(diff<-before*0.03){sfx('lose');shake()}else sfx('tick');save();render();bumpNW()}
  else for(const m of msgs)if(m[1]!=='g'||stop)tel.skipMsgs.push(m);
  if(S.mcall&&!$('#modal').classList.contains('on'))modal(`<div class="bubble">${BEAR}<p>${L('Bạn đang bị GỌI KÝ QUỸ: tiền mặt âm','You have a MARGIN CALL: cash is negative')} (${money(S.cash)}).</p></div><p>${L('Hợp đồng tương lai được tính lãi/lỗ vào tiền mặt mỗi phiên. Trước phiên sau, hãy đóng bớt hợp đồng hoặc bán tài sản để tiền mặt ≥ 0. Nếu không, sàn sẽ tự đóng toàn bộ vị thế tương lai.','Futures P&L is settled into cash every session. Before the next session, close some contracts or sell assets so cash is ≥ 0. Otherwise the broker will liquidate all your futures.')}</p><button class="btn w r" data-a="goPort">${L('Xem danh mục','Open portfolio')}</button>`);
  else if(em&&!quiet&&!$('#modal').classList.contains('on')){const[d,e]=em,w=whyTxt(e);
    modal(`<h3>📣 ${d.name} (${d.sym}) ${L('báo cáo lợi nhuận (mô phỏng)','reports earnings (simulated)')}</h3>${earnHtml(e)}<div class="bubble">${e.ret>=0?BULL:BEAR}<p>${e.sur>=0&&e.ret<0?L('Lãi vượt kỳ vọng mà giá vẫn giảm: ','Beat on earnings, yet the stock fell: '):e.sur<0&&e.ret>=0?L('Lãi hụt mà giá vẫn tăng: ','Missed on earnings, yet the stock rose: '):''}${w?w.charAt(0).toUpperCase()+w.slice(1)+'. ':''}${L(`IV của ${d.sym} vừa xẹp — xem lại lệnh ở Danh mục.`,`${d.sym} IV just collapsed — check your positions in Portfolio.`)}</p></div><button class="btn w" data-a="closeModal">${L('Đã hiểu','Got it')}</button>`)}
  if(broke())gameOver();
  return stop}
function skipN(n){if(busy)return;busy=true;tel.skipMsgs=[];const start=netWorth(),d0=S.date;let i=0,stopped=false;
  const run=()=>{const chunk=Math.min(n-i,n>30?21:5);for(let k=0;k<chunk;k++){i++;if(nextDay(true)){stopped=true;break}if(S.over||$('#modal').classList.contains('on')){stopped=true;break}}
    render();if(i<n&&!stopped){setTimeout(run,n>30?60:200)}else{busy=false;save();bumpNW();const diff=netWorth()-start;
      toast(L(`⏩ ${dfull(d0)} → ${dfull(S.date)} (${i} phiên): ${sgn(diff)}`,`⏩ ${dfull(d0)} → ${dfull(S.date)} (${i} sessions): ${sgn(diff)}`),diff>=0?'g':'r');
      for(const m of tel.skipMsgs.slice(-3))toast(m[0],m[1]);if(stopped&&i<n&&!$('#modal').classList.contains('on'))toast(L('⏸️ Dừng tua vì có sự kiện với vị thế của bạn','⏸️ Paused: something happened to your positions'),'y');sfx(diff>=0?'win':'lose')}};
  run()}
function whyTxt(e){const r=[];
  if(e.guid<0)r.push(L('công ty HẠ dự báo quý tới','the company CUT next-quarter guidance'));if(e.guid>0)r.push(L('công ty NÂNG dự báo','the company RAISED guidance'));
  if(e.rev<-0.005)r.push(L('doanh thu hụt kỳ vọng','revenue missed'));if(e.rev>0.012)r.push(L('doanh thu vượt mạnh','revenue beat strongly'));
  if(e.run>0.8)r.push(L('giá đã chạy trước, tin tốt nằm sẵn trong giá','the stock ran up beforehand, so good news was priced in'));if(e.run<-0.8)r.push(L('giá đã bị bán mạnh trước đó nên kỳ vọng rất thấp','the stock was sold off beforehand, so expectations were very low'));
  if(e.sur>0&&e.ret<0&&!r.length)r.push(L('thị trường kỳ vọng ngầm cao hơn con số dự báo','the market\'s unofficial "whisper" number was higher than the consensus'));
  if(e.sur<0&&e.ret>0&&!r.length)r.push(L('kết quả "đỡ tệ hơn lo ngại"','results were "less bad than feared"'));
  return r.join('; ')}
function earnHtml(e){return `<div class="er"><span>${L('EPS thực tế / dự báo','EPS actual / estimate')}</span><b class="${cls(e.sur)}">$${e.act.toFixed(2)} / $${e.est.toFixed(2)} (${pc(e.sur)})</b>
  <span>${L('Doanh thu so với dự báo','Revenue vs. estimate')}</span><b class="${cls(e.rev)}">${pc(e.rev)}</b><span>${L('Dự báo quý tới (guidance)','Next-quarter guidance')}</span><b class="${e.guid>0?'up':e.guid<0?'dn':''}">${e.guid>0?L('Nâng','Raised'):e.guid<0?L('Hạ','Cut'):L('Giữ nguyên','Maintained')}</b>
  <span>${L('Giá 20 ngày trước báo cáo','Price in the 20 days before')}</span><b>${e.run>0.8?L('Đã tăng mạnh','Ran up sharply'):e.run<-0.8?L('Đã giảm mạnh','Sold off sharply'):L('Bình thường','Normal')}</b><span>${L('Phản ứng giá','Price reaction')}</span><b class="${cls(e.ret)}">${pc(e.ret)}</b></div>`}
function gameOver(){if(!S.over){S.over=true;tlog('game_over',{d:{sessions:S.day,trades:S.ntr||0,wins:S.wins,losses:S.losses,fees:Math.round(S.fees)}});save()}sfx('lose');shake();modal(`<div class="bubble">${BEAR}<p>${L('Cháy tài khoản rồi! Ngoài đời thật tiền này không quay lại đâu.','Account blown! In real life, that money would not come back.')}</p></div><h3>💀 ${L(`Hết vốn sau ${S.day} phiên`,`Out of money after ${S.day} sessions`)}</h3><p>${L('Bài học lớn nhất: <b>đi lệnh nhỏ</b>. Mỗi lệnh quyền chọn chỉ nên chiếm vài % tài khoản, và luôn tính trước khoản lỗ của hợp đồng tương lai.','The biggest lesson: <b>size small</b>. Each option trade should be a few % of the account, and always work out your futures loss in advance.')}</p><button class="btn w g" data-a="restart">${L('Chơi lại với $10,000','Start over with $10,000')}</button>`)}
function pickExp(){const e=expiries();T.exp=e.find(x=>calDays(S.date,x)>=14)||e[e.length-1]}
function resetK(){const s=S.st[T.sym],st=stepOf(s.px),a=atm(s);T.K={cc:a+st,bearcall:a+st,csp:a-st,bullput:a-st,pp:a-st}[T.strat]||a;T.w=1;T.d=T.strat==='strangle'||T.strat==='collar'?1:2;if(!expiries().includes(T.exp))pickExp();fixK()}
function fixK(){const s=S.st[T.sym],st=stepOf(s.px);T.K=Math.round(T.K/st)*st;const hi=Math.round(s.px*2/st)*st;
  for(let i=0;i<60;i++){const mn=Math.min(...legsOf(T).map(l=>l.K));if(mn>=st)break;T.K+=st}T.K=Math.min(T.K,hi)}

/* ============ điều khiển ============ */
function save(){S.ts=Date.now();S.lang=LANG;S.pl=PL;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}cloudQueue()}
function act(a,v){
  if(a==='tab'){tab=v;detail=false;if(v==='trade'){if(!T.K)resetK();fixK()}if(v==='miss')loadBoard();render();$('#view').scrollTop=0}
  else if(a==='stock'){if(isCmd(v)){F.root=v==='GOLD'?'MGC':'MCL';F.exp=futExps(F.root)[0];tab='trade';tmode='fut';detail=false;render();$('#view').scrollTop=0;return}sel=v;tab='market';detail=true;render();$('#view').scrollTop=0}
  else if(a==='back'){detail=false;render()}
  else if(a==='sector'){sector=v;render()}
  else if(a==='range'){chartRange=v;render()}
  else if(a==='seg'){tmode=v;if(v==='calc'&&!C.init)calcFill();render();$('#view').scrollTop=0}
  else if(a==='goTrade'){T.sym=sel;tab='trade';tmode='opt';detail=false;resetK();render();$('#view').scrollTop=0}
  else if(a==='goStk'){Q.sym=sel;tab='trade';tmode='stk';detail=false;render();$('#view').scrollTop=0}
  else if(a==='goFut'){const f=FUT.find(x=>x.und===sel);if(f){F.root=f.root;F.exp=futExps(f.root)[0]}tab='trade';tmode='fut';detail=false;render();$('#view').scrollTop=0}
  else if(a==='goPort'){$('#modal').classList.remove('on');tab='port';detail=false;render();$('#view').scrollTop=0}
  else if(a==='sym'){T.sym=v;resetK();render()}
  else if(a==='strat')setStrat(v)
  else if(a==='K'){T.K+=+v*stepOf(S.st[T.sym].px);fixK();render()}
  else if(a==='pickC'||a==='pickP'){const fam=a==='pickC'?['call','cc','bull','bearcall','butterfly']:['put','csp','bear','bullput','pp'];if(!fam.includes(T.strat))T.strat=fam[0];T.K=+v;fixK();render()}
  else if(a==='w'){T.w=clamp(T.w+ +v,1,4);fixK();render()}
  else if(a==='d'){T.d=clamp(T.d+ +v,1,6);fixK();render()}
  else if(a==='exp'){T.exp=v;render()}
  else if(a==='qty'){T.qty=clamp(T.qty+ +v,1,20);render()}
  else if(a==='place')place()
  else if(a==='close')closePos(v)
  else if(a==='futRoot'){if(level()<FUT_LV)return toast(L(`🔒 Hợp đồng tương lai mở ở cấp ${FUT_LV}`,`🔒 Futures unlock at level ${FUT_LV}`),'r');F.root=v;F.exp=futExps(v)[0];render()}
  else if(a==='futExp'){F.exp=v;render()}
  else if(a==='futQty'){F.qty=clamp(F.qty+ +v,1,20);render()}
  else if(a==='futBuy')openFut(1)
  else if(a==='futSell')openFut(-1)
  else if(a==='futClose')closeFut(v)
  else if(a==='stkSym'){Q.sym=v;render()}
  else if(a==='stkQty'){Q.qty=Math.max(1,v==='max'?Math.floor(S.cash/S.st[Q.sym].px)||1:v[0]==='+'||v[0]==='-'?Q.qty+ +v:+v);render()}
  else if(a==='stkBuy')buyStock(Q.sym,Q.qty)
  else if(a==='stkSell')sellStock(Q.sym,Q.qty)
  else if(a==='stkSellAll')sellStock(Q.sym,freeSh(Q.sym))
  else if(a==='dcaAmt'){Q.dca=clamp(Q.dca+ +v,25,5000);render()}
  else if(a==='dcaAdd'){const ex=S.dca.find(p=>p.sym===Q.sym);if(ex)ex.amt=Q.dca;else S.dca.push({sym:Q.sym,amt:Q.dca});tlog('dca_plan',{d:{sym:Q.sym,amt:Q.dca,plans:S.dca.length}});
    toast(L(`🔁 Mỗi tháng sẽ tự mua ${money(Q.dca)} ${Q.sym} vào phiên đầu tháng`,`🔁 ${money(Q.dca)} of ${Q.sym} will be bought on the first session of every month`),'g');fire('dca');save();render()}
  else if(a==='dcaDel'){S.dca=S.dca.filter(p=>p.sym!==v);tlog('dca_plan',{d:{removed:v}});save();render()}
  else if(a==='drip'){S.drip=!S.drip;tlog('drip',{d:{on:S.drip}});save();render()}
  else if(a==='calcType'){C.type=v;updCalc()}
  else if(a==='calcView'){C.view=v;updCalc()}
  else if(a==='calcFill'){calcFill(v);render()}
  else if(a==='next'){if(!busy)nextDay()}
  else if(a==='skipMenu')modal(`<h3>⏩ ${L('Tua thời gian','Skip ahead')}</h3><p>${L('Tua nhanh dành cho đầu tư dài hạn. Game tự dừng khi có sự kiện với vị thế của bạn (đáo hạn, báo cáo lợi nhuận, gọi ký quỹ).','Fast-forward for long-term investing. It stops automatically when something happens to your positions (expiry, earnings, margin call).')}</p>
    <div class="kv">${[[5,L('1 tuần','1 week')],[21,L('1 tháng','1 month')],[63,L('1 quý','1 quarter')],[252,L('1 năm','1 year')]].map(x=>`<button class="btn b" data-a="skip" data-v="${x[0]}">${x[1]}<br><small>${x[0]} ${L('phiên','sessions')}</small></button>`).join('')}</div>
    <button class="btn d w" style="margin-top:10px" data-a="closeModal">${L('Đóng','Close')}</button>`)
  else if(a==='skip'){$('#modal').classList.remove('on');skipN(+v)}
  else if(a==='lang'){const l0=LANG;setLang(v||(LANG==='vi'?'en':'vi'));if(l0!==LANG)tlog('language',{d:{from:l0,to:LANG}});S.lang=LANG;save();render();if($('#modal').classList.contains('on')&&!S.intro)showIntro();else if(v==null)toast(L('🇻🇳 Đã chuyển sang Tiếng Việt','🇺🇸 Switched to English'),'y')}
  else if(a==='closeModal'){$('#modal').classList.remove('on');if(!S.intro){S.intro=true;save()}if(SHEET_ON&&!PL.name)askName(true)}
  else if(a==='saveName'){const i=$('#nm'),n=(i?i.value:'').replace(/[<>]/g,'').trim().slice(0,20);if(n.length<2)return toast(L('Tên cần ít nhất 2 ký tự','Name needs at least 2 characters'),'r');
    const was=PL.name;PL.name=n;savePL();save();tlog(was?'rename':'name_set',{d:{from:was,to:n}});$('#modal').classList.remove('on');telFlush();tel.lbAt=0;render();if(tab==='miss')loadBoard(true)}
  else if(a==='editName')askName(false)

function advise(a){const s=S.st[T.sym],long=a.q.net>0,cov=s.earn&&T.exp>=s.earn,nw=netWorth(),pct=Math.abs(a.maxLoss)/nw*100,dte=calDays(S.date,T.exp),ivr=ivRank(s);

  if(pct>15&&!withShares(T.strat)&&T.strat!=='csp')return[BEAR,L(`Lệnh này có thể mất ${pct.toFixed(0)}% tài sản! Cao thủ thường chỉ liều 2–5% mỗi lệnh.`,`This trade could lose ${pct.toFixed(0)}% of your account! Pros usually risk only 2–5% per trade.`)];
  if(long&&cov)return[BEAR,L(`Kỳ hạn này bao trùm báo cáo ngày ${dfmt(s.earn)}: IV đang phồng. Sau báo cáo IV xẹp — đúng hướng vẫn có thể lỗ.`,`This expiry covers the ${dfmt(s.earn)} earnings report, so IV is inflated. After the report IV collapses — you can be right on direction and still lose.`)];

  if(long&&dte<=7)return[BEAR,L('Còn ít ngày: Theta ăn rất nhanh. Giá phải chạy đúng hướng ngay.','Few days left: theta decays fast. The stock has to move your way right now.')];

function ctxOf(id){const c=$(id);if(!c)return null;const r=c.getBoundingClientRect(),dp=Math.min(3,window.devicePixelRatio||1);c.width=r.width*dp;c.height=r.height*dp;const g=c.getContext('2d');g.scale(dp,dp);return{g,w:r.width,h:r.height}}
function grid(g,w,h,mn,mx,Y){g.strokeStyle='#263070';g.lineWidth=1;g.fillStyle='#a9b3e6';g.font='700 11px sans-serif';g.textAlign='left';

    const up=a[a.length-1]>=a[0],col=up?'#3ddc84':'#ff5d6c',gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,col+'77');gr.addColorStop(1,col+'00');

  /* nến dựng lại từ giá đóng cửa: mở = đóng cửa phiên trước, râu nến theo biến động */

    g.beginPath();g.moveTo(X(i),Y(c[1]));g.lineTo(X(i),Y(c[2]));g.stroke();
    const y1=Y(Math.max(c[0],c[3])),y2=Y(Math.min(c[0],c[3]));if(up){g.fillStyle='#0a0f30';g.fillRect(X(i)-cw*.33,y1,cw*.66,Math.max(1.5,y2-y1));g.strokeRect(X(i)-cw*.33,y1,cw*.66,Math.max(1.5,y2-y1))}else g.fillRect(X(i)-cw*.33,y1,cw*.66,Math.max(1.5,y2-y1))});
  g.beginPath();let st=false;a.forEach((c,i)=>{const j=cl.length-n+i;if(j<19)return;let m=0;for(let k=j-19;k<=j;k++)m+=cl[k];m/=20;if(m<mn||m>mx){st=false;return}st?g.lineTo(X(i),Y(m)):g.moveTo(X(i),Y(m));st=true});

  g.strokeStyle='#ff9ecb';g.beginPath();g.moveTo(X(C.K),4);g.lineTo(X(C.K),h-12);g.stroke();g.fillStyle='#ff9ecb';g.fillText('K '+C.K,clamp(X(C.K),24,w-70),12);
  const nm={p:L('Giá quyền chọn','Option price'),d:'Delta',g:'Gamma',th:L('Theta mỗi ngày','Theta per day'),ve:L('Vega mỗi 1% IV','Vega per 1% IV')}[key];
  const lg=$('#ccLeg');if(lg)lg.innerHTML=`<span style="color:var(--blue)">${exp.length?'- - ':'— '}${nm} ${L('hôm nay','today')} (${C.days} ${L('ngày','days')})</span>${exp.length?` · <span style="color:#fff">— ${L('lúc đáo hạn','at expiry')}</span>`:''} · <span class="gold">S</span> · <span style="color:#ff9ecb">K</span>`}

/* ============ hiệu ứng ============ */
function toast(t,c=''){const e=document.createElement('div');e.className='toast '+c;e.textContent=t;const box=$('#toasts');box.appendChild(e);while(box.children.length>4)box.firstChild.remove();setTimeout(()=>e.remove(),5000)}
function modal(h){const m=$('#modal');m.innerHTML='<div class="card">'+h+'</div>';m.classList.add('on')}
function shake(){const a=$('#app');a.classList.remove('shake');void a.offsetWidth;a.classList.add('shake')}
let AC;function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
function sfx(k){if(!AC)return;const seq={buy:[[520,.06],[780,.09]],win:[[660,.07],[880,.07],[1320,.14]],lose:[[300,.1],[200,.18]],tick:[[440,.04]],lvl:[[523,.09],[659,.09],[784,.09],[1047,.2]]}[k];let t=AC.currentTime;
  for(const[f,d]of seq){const o=AC.createOscillator(),g=AC.createGain();o.type=k==='lose'?'sawtooth':'triangle';o.frequency.value=f;g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d);t+=d*.8}}
let parts=[],raf=0;
function confetti(n){const c=$('#fx');c.width=innerWidth;c.height=innerHeight;for(let i=0;i<n;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*120,y:innerHeight*.3,vx:(Math.random()-.5)*11,vy:-Math.random()*11-3,r:4+Math.random()*5,c:pick(['#ffc93c','#3ddc84','#59c8ff','#ff9ecb','#fff']),a:Math.random()*6,l:1});if(!raf)raf=requestAnimationFrame(fxLoop)}
function fxLoop(){const c=$('#fx'),g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);parts=parts.filter(p=>p.l>0&&p.y<c.height+20);
  for(const p of parts){p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.a+=.2;p.l-=.012;g.save();g.translate(p.x,p.y);g.rotate(p.a);g.globalAlpha=clamp(p.l*2,0,1);g.fillStyle=p.c;g.strokeStyle='#070b22';g.lineWidth=1.5;g.fillRect(-p.r,-p.r/2,p.r*2,p.r);g.strokeRect(-p.r,-p.r/2,p.r*2,p.r);g.restore()}
  raf=parts.length?requestAnimationFrame(fxLoop):0;if(!raf)g.clearRect(0,0,c.width,c.height)}

/* ============ khởi động ============ */
S=load();if(!S)newGame('first');else ensureGame();if(S.pl&&S.pl.id&&S.pl.id!==PL.id&&!PL.name){PL=S.pl;savePL()}
if(S.lang==='vi'||S.lang==='en')setLang(S.lang);else setLang(LANG);
resetK();F.exp=futExps(F.root)[0];
render();
window.addEventListener('resize',()=>render());
cloudInit();
tlog('visit',{d:{ua:navigator.userAgent.slice(0,120),screen:screen.width+'x'+screen.height,lang:LANG,host:location.hostname||'file',queued:tel.q.length}});
setInterval(telFlush,20000);
if(!S.intro)showIntro();else if(SHEET_ON&&!PL.name)setTimeout(()=>{if(!$('#modal').classList.contains('on'))askName(true)},600);
window.__game={get S(){return S},tel,get PL(){return PL},get LANG(){return LANG},T,F,Q,C,act,netWorth,analyse,nextDay,place,level,expiries,ivAt,legQ,futPx,futExps,skipN,bs};
