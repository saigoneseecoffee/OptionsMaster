<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Options Master</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#070b22;--bg:#0f1640;--card:#222c6e;--card2:#2c3888;--gold:#ffc93c;--green:#3ddc84;--red:#ff5d6c;--blue:#59c8ff;--purple:#b98cff;--txt:#f4f6ff;--mut:#a9b3e6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#060920;color:var(--txt);font-family:'Baloo 2',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.3;overscroll-behavior:none}
button{font-family:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
#app{max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;background:radial-gradient(120% 60% at 50% 0%,#2a3aa0 0%,var(--bg) 55%,#0a0f30 100%);position:relative;overflow:hidden}
#app.shake{animation:shake .35s}
@keyframes shake{20%{transform:translate(-6px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(2px,0)}}
#hud{padding:10px 12px 8px;border-bottom:3px solid var(--ink);background:linear-gradient(#2b379a,#1c2670)}
.hudrow{display:flex;align-items:center;gap:6px}
.logo{font-weight:800;font-size:16px;color:var(--gold);text-shadow:0 2px 0 var(--ink);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{background:var(--ink);border-radius:999px;padding:2px 8px;font-weight:700;font-size:13px;white-space:nowrap}
.nw{font-size:30px;font-weight:800;line-height:1;text-shadow:0 3px 0 var(--ink)}
.nw small{font-size:13px;font-weight:700;margin-left:6px}
.sub{font-size:12px;color:var(--mut);font-weight:500}
.xp{height:10px;background:var(--ink);border-radius:9px;overflow:hidden;border:2px solid var(--ink)}
.xp i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ff9f1c);border-radius:9px;transition:width .5s cubic-bezier(.2,1.4,.4,1)}
#view{flex:1;overflow-y:auto;padding:10px 10px 16px;-webkit-overflow-scrolling:touch}
.card{background:linear-gradient(var(--card2),var(--card));border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);padding:10px 12px;margin-bottom:12px}
.card h3{margin:0 0 6px;font-size:16px;font-weight:800;color:var(--gold)}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.up{color:var(--green)}.dn{color:var(--red)}.mut{color:var(--mut)}.gold{color:var(--gold)}
.big{font-size:19px;font-weight:800}
.tk{width:48px;height:46px;border-radius:13px;border:3px solid var(--ink);display:grid;place-items:center;font-weight:800;font-size:11.5px;box-shadow:0 3px 0 var(--ink);color:var(--ink);flex:none}
.stock{display:flex;align-items:center;gap:9px;width:100%;text-align:left}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:8px;padding:1px 7px;border:2px solid var(--ink);background:var(--ink);white-space:nowrap}
.tag.e{background:var(--purple);color:var(--ink)}.tag.g{background:var(--green);color:var(--ink)}.tag.r{background:var(--red);color:var(--ink)}.tag.y{background:var(--gold);color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);padding:8px 14px;font-weight:800;font-size:15px;background:var(--gold);color:var(--ink);min-height:44px;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
.btn.g{background:var(--green)}.btn.r{background:var(--red)}.btn.b{background:var(--blue)}.btn.d{background:#3a479c;color:var(--txt)}
.btn.sm{min-height:36px;padding:4px 10px;font-size:13px;border-radius:11px}
.btn.w{width:100%}
.btn[disabled]{opacity:.45;filter:grayscale(.6)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:3px solid var(--ink);border-radius:12px;padding:5px 9px;font-weight:700;font-size:13px;background:#34409a;box-shadow:0 3px 0 var(--ink);min-height:38px}
.chip.on{background:var(--gold);color:var(--ink)}
.chip.lock{opacity:.5}
.chip small{font-weight:500;font-size:11px}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sgrid .chip{padding:6px 2px;font-size:11px;line-height:1.15;display:flex;flex-direction:column;align-items:center;gap:1px}
.sgrid .chip b{font-size:18px;line-height:1}
.step{display:flex;align-items:center;gap:6px}
.step button{width:40px;height:40px;border-radius:12px;border:3px solid var(--ink);background:var(--blue);color:var(--ink);font-size:22px;font-weight:800;box-shadow:0 3px 0 var(--ink)}
.step button:active{transform:translateY(3px);box-shadow:none}
.step .v{min-width:70px;text-align:center;font-weight:800;font-size:18px}
.lbl{font-size:12px;color:var(--mut);font-weight:700;margin:8px 0 4px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.kv div{background:var(--ink);border-radius:10px;padding:5px 8px}
.kv span{display:block;font-size:11px;color:var(--mut);font-weight:700}
.kv b{font-size:15px}
canvas.ch{width:100%;height:170px;display:block;border-radius:12px;background:#0a0f30;border:3px solid var(--ink)}
.bubble{display:flex;gap:8px;align-items:flex-start;margin:8px 0}
.bubble svg{width:52px;height:52px;flex:none}
.bubble p{margin:0;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:14px 14px 14px 4px;padding:6px 10px;font-size:13.5px;font-weight:700;line-height:1.25;box-shadow:0 3px 0 var(--ink)}
.chain{display:grid;grid-template-columns:1fr 34px 58px 34px 1fr;gap:3px;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
.chain>*{background:var(--ink);border-radius:7px;padding:5px 2px;text-align:center;min-height:32px;display:grid;place-items:center}
.chain .hd{background:none;color:var(--mut);font-size:10.5px;min-height:0;padding:0}
.chain .k{background:#3a479c;font-weight:800;font-size:13.5px}
.chain .k.atm{background:var(--gold);color:var(--ink)}
.chain .itm{background:#1d3a5e}
.chain .selc{outline:3px solid var(--gold)}
.chain .dl{color:var(--mut);font-size:11px;background:none}
#bar{display:flex;gap:8px;padding:8px 10px;background:#141b52;border-top:3px solid var(--ink)}
#tabs{display:flex;background:var(--ink);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
#tabs button{flex:1;padding:5px 0 3px;font-size:11px;font-weight:700;color:var(--mut);border-radius:10px;position:relative}
#tabs button b{display:block;font-size:20px;line-height:1.1}
#tabs button.on{background:#2b379a;color:var(--gold)}
#tabs .dot{position:absolute;top:3px;right:22%;width:10px;height:10px;border-radius:9px;background:var(--red);border:2px solid var(--ink)}
#toasts{position:fixed;left:50%;top:8px;transform:translateX(-50%);width:min(94vw,450px);z-index:50;pointer-events:none;display:flex;flex-direction:column;gap:6px}
.toast{background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);padding:7px 12px;font-weight:700;font-size:13.5px;line-height:1.25;animation:tin .35s cubic-bezier(.2,1.5,.4,1),tout .3s 4.6s forwards}
.toast.g{background:var(--green)}.toast.r{background:var(--red)}.toast.y{background:var(--gold)}
@keyframes tin{from{transform:translateY(-40px) scale(.8);opacity:0}}
@keyframes tout{to{transform:translateY(-20px);opacity:0}}
#modal{position:fixed;inset:0;background:rgba(4,6,24,.82);z-index:60;display:none;align-items:center;justify-content:center;padding:16px}
#modal.on{display:flex}
#modal .card{max-width:420px;width:100%;max-height:86dvh;overflow:auto;animation:pop .3s cubic-bezier(.2,1.5,.4,1)}
#modal p{font-size:14.5px;margin:4px 0 10px}
@keyframes pop{from{transform:scale(.7);opacity:0}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:70;width:100%;height:100%}
.pos{border-top:2px dashed #3a479c;padding:8px 0}.pos:first-of-type{border-top:0}
.miss{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:2px dashed #3a479c}.miss:first-of-type{border-top:0}
.miss .ic{width:34px;height:34px;border-radius:10px;border:3px solid var(--ink);display:grid;place-items:center;font-size:16px;background:#3a479c;flex:none}
.miss.done .ic{background:var(--green);color:var(--ink)}.miss.cur .ic{background:var(--gold);color:var(--ink);animation:pulse 1s infinite alternate}
@keyframes pulse{to{transform:scale(1.12)}}
.miss.lockd{opacity:.45}
details{border-top:2px dashed #3a479c;padding:6px 0}details:first-of-type{border-top:0}
summary{font-weight:800;font-size:15px;list-style:none;cursor:pointer}summary::before{content:'▸ ';color:var(--gold)}details[open] summary::before{content:'▾ '}
details p{margin:6px 0 2px;font-size:14px;font-weight:500;color:#dfe4ff}
.news{font-size:13.5px;font-weight:700;padding:3px 0}
.er{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:14px;font-weight:700;background:var(--ink);border-radius:10px;padding:8px 10px;margin:6px 0}
.bump{animation:bump .4s cubic-bezier(.2,1.6,.4,1)}@keyframes bump{from{transform:scale(1.25)}}
</style>
</head>
<body>
<div id="app">
  <header id="hud"></header>
  <main id="view"></main>
  <div id="bar"></div>
  <nav id="tabs"></nav>
</div>
<div id="toasts"></div>
<div id="modal"></div>
<canvas id="fx"></canvas>
<script>
"use strict";
/* ============ tiện ích ============ */
const $=s=>document.querySelector(s);
const money=(n,d=0)=>(n<0?'-':'')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const sgn=(n,d=0)=>(n>=0?'+':'-')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const pc=(x,d=1)=>(x>=0?'+':'')+(x*100).toFixed(d)+'%';
const cls=n=>n>=0?'up':'dn';
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const pick=a=>a[Math.random()*a.length|0];
const gauss=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
const kf=k=>k%1?k.toFixed(1):''+k;
const r2=x=>Math.round(x*100)/100;

/* ============ ngôn ngữ / language ============ */
let LANG=(()=>{let l=null;try{l=localStorage.getItem('om-lang')}catch(e){}if(l==='vi'||l==='en')return l;return(navigator.language||'').toLowerCase().startsWith('vi')?'vi':'en'})();
const L=(v,e)=>LANG==='en'?e:v;
const LX=o=>o?(Array.isArray(o)?(LANG==='en'?o[1]:o[0]):o):'';
function setLang(l){LANG=l;try{localStorage.setItem('om-lang',l)}catch(e){}document.documentElement.lang=l}

/* ============ lịch giao dịch Mỹ ============ */
const DAYMS=864e5,HOL=['2026-11-26','2026-12-25','2027-01-01','2027-01-18','2027-02-15','2027-03-26','2027-05-31','2027-06-18','2027-07-05','2027-09-06','2027-11-25','2027-12-24'];
const toD=i=>new Date(i+'T00:00:00Z'),iso=d=>d.toISOString().slice(0,10);
const addD=(i,n)=>iso(new Date(toD(i).getTime()+n*DAYMS));
const dow=i=>toD(i).getUTCDay();
const isTD=i=>{const w=dow(i);return w>0&&w<6&&!HOL.includes(i)};
const nextTD=i=>{do i=addD(i,1);while(!isTD(i));return i};
const addTD=(i,n)=>{while(n-->0)i=nextTD(i);return i};
const calDays=(a,b)=>Math.round((toD(b)-toD(a))/DAYMS);
const dm=i=>L(i.slice(8)+'/'+i.slice(5,7),(+i.slice(5,7))+'/'+(+i.slice(8)));
const dfmt=i=>L(['CN','T2','T3','T4','T5','T6','T7'],['Sun','Mon','Tue','Wed','Thu','Fri','Sat'])[dow(i)]+' '+dm(i);
const adjF=f=>{while(!isTD(f))f=addD(f,-1);return f};
function thirdFri(y,m){let d=y+'-'+String(m).padStart(2,'0')+'-01';while(dow(d)!==5)d=addD(d,1);return addD(d,14)}
function expiries(){const d=S.date,out=[];let f=d;while(dow(f)!==5)f=addD(f,1);if(f<=d)f=addD(f,7);
  for(let i=0;i<4;i++){const a=adjF(addD(f,7*i));if(a>d)out.push(a)}
  const last=out[out.length-1];let y=+d.slice(0,4),m=+d.slice(5,7),n=0;
  for(let k=0;k<5&&n<2;k++){const a=adjF(thirdFri(y,m));if(a>last){out.push(a);n++}if(++m>12){m=1;y++}}
  return out}
const isMonthly=e=>{const t=thirdFri(+e.slice(0,4),+e.slice(5,7));return e===adjF(t)};
function macro(d){const day=+d.slice(8);
  const fed=calDays('2026-12-09',d);if(fed>=0&&fed%42===0)return{k:'FED'};
  let c=d.slice(0,8)+'12';while(!isTD(c))c=addD(c,1);if(c===d)return{k:'CPI'};
  if(dow(d)===5&&day<=7)return{k:'JOBS'};return null}
const macroName=k=>({FED:L('Fed công bố lãi suất','Fed rate decision'),CPI:L('Số liệu lạm phát CPI','CPI inflation report'),JOBS:L('Báo cáo việc làm','Jobs report')})[k]||k;

/* ============ Black-Scholes ============ */
function ncdf(x){const t=1/(1+0.2316419*Math.abs(x)),d=0.3989423*Math.exp(-x*x/2);
  const p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return x>0?1-p:p}
function bs(type,S0,K,T,v){
  if(T<=0){const p=Math.max(0,type==='C'?S0-K:K-S0);return{p,d:type==='C'?(S0>K?1:0):(S0<K?-1:0),th:0,ve:0}}
  const r=0.04,sq=v*Math.sqrt(T),d1=(Math.log(S0/K)+(r+v*v/2)*T)/sq,d2=d1-sq,pdf=Math.exp(-d1*d1/2)/2.5066283,e=Math.exp(-r*T);
  const ve=S0*pdf*Math.sqrt(T)/100;
  if(type==='C')return{p:S0*ncdf(d1)-K*e*ncdf(d2),d:ncdf(d1),th:(-S0*pdf*v/(2*Math.sqrt(T))-r*K*e*ncdf(d2))/365,ve};
  return{p:K*e*ncdf(-d2)-S0*ncdf(-d1),d:ncdf(d1)-1,th:(-S0*pdf*v/(2*Math.sqrt(T))+r*K*e*ncdf(-d2))/365,ve};
}

/* ============ dữ liệu (công ty hư cấu) ============ */
const DEFS=[
 {sym:'USX',name:'US 500 Index ETF',sec:'Index',px:560,vol:.15,beta:1,liq:.5,col:'#ffffff',idx:1},
 {sym:'ORCD',name:'Orchard Devices',sec:'Consumer Tech',px:228,vol:.27,beta:1.15,liq:.8,col:'#c9d4ff',pe:30},
 {sym:'NVXS',name:'Novaxis Semiconductor',sec:'Semiconductors',px:182,vol:.48,beta:1.7,liq:.8,col:'#8ef0a0',pe:45},
 {sym:'VLTM',name:'Voltaic Motors',sec:'Electric Vehicles',px:265,vol:.58,beta:1.9,liq:1,col:'#ff7b54',pe:70},
 {sym:'SKYB',name:'Skybridge Cloud',sec:'Software',px:96,vol:.42,beta:1.4,liq:1.4,col:'#59c8ff',pe:55},
 {sym:'HTGB',name:'Heritage Bancorp',sec:'Banks',px:58,vol:.24,beta:.95,liq:1.3,col:'#ffc93c',pe:12},
 {sym:'MRDH',name:'Meridian Health',sec:'Healthcare',px:142,vol:.22,beta:.6,liq:1.2,col:'#ff9ecb',pe:18},
 {sym:'PXEN',name:'Paxton Energy',sec:'Oil & Gas',px:74,vol:.31,beta:.8,liq:1.5,col:'#d7a86e',pe:11},
 {sym:'BSBG',name:'Big Sky Burger',sec:'Restaurants',px:41,vol:.29,beta:.7,liq:2,col:'#b98cff',pe:24}];
const STR={
 call:{n:'Long Call',ic:'📈',lv:1,d:['Kỳ vọng giá TĂNG mạnh. Lỗ tối đa = premium đã trả.','You expect a strong move UP. Max loss = the premium you paid.']},
 put:{n:'Long Put',ic:'📉',lv:1,d:['Kỳ vọng giá GIẢM mạnh, hoặc mua "bảo hiểm" cho cổ phiếu.','You expect a strong move DOWN, or want "insurance" on shares you own.']},
 cc:{n:'Covered Call',ic:'🛡️',lv:2,d:['Đang giữ 100 cp, bán Call để thu premium. Giá vượt strike thì cp bị gọi mua.','Own 100 shares and sell a Call for income. Above the strike, your shares get called away.']},
 csp:{n:'Cash-Secured Put',ic:'💰',lv:3,d:['Thu premium, sẵn sàng mua 100 cp ở giá strike nếu giá rớt.','Collect premium and stand ready to buy 100 shares at the strike if price drops.']},
 bull:{n:'Bull Call Spread',ic:'🐂',lv:4,d:['Tăng vừa phải. Mua 1 Call + bán 1 Call cao hơn để giảm chi phí.','Moderately bullish. Buy a Call and sell a higher Call to cut the cost.']},
 bear:{n:'Bear Put Spread',ic:'🐻',lv:4,d:['Giảm vừa phải. Mua 1 Put + bán 1 Put thấp hơn để giảm chi phí.','Moderately bearish. Buy a Put and sell a lower Put to cut the cost.']},
 bullput:{n:'Bull Put Spread',ic:'🟢',lv:4,d:['Spread thu tiền: thắng nếu giá KHÔNG rớt qua strike bán. Lỗ có giới hạn.','Credit spread: wins if price stays ABOVE the short strike. Risk is capped.']},
 bearcall:{n:'Bear Call Spread',ic:'🔴',lv:4,d:['Spread thu tiền: thắng nếu giá KHÔNG vượt strike bán. Lỗ có giới hạn.','Credit spread: wins if price stays BELOW the short strike. Risk is capped.']},
 straddle:{n:'Long Straddle',ic:'💥',lv:5,d:['Cược giá chạy MẠNH theo hướng nào cũng được. Sợ nhất đi ngang & IV xẹp.','Bet on a BIG move either way. Its enemies: a flat stock and an IV crush.']},
 condor:{n:'Iron Condor',ic:'🦅',lv:6,d:['Cược giá ĐI NGANG trong vùng. Thu premium, lỗ có giới hạn.','Bet the stock stays in a RANGE. Collect premium with capped risk.']}};
const LV=[0,200,500,800,1000,1150,2000,3200,5000,8000,1e9];
const RANK=[null,['Tập Sự','Rookie'],['Lính Mới','Recruit'],['Tay Chơi','Player'],['Thợ Săn Premium','Premium Hunter'],['Chiến Lược Gia','Strategist'],['Cao Thủ','Master'],['Bậc Thầy','Grandmaster'],['Cá Mập','Shark'],['Huyền Thoại','Legend'],['Huyền Thoại','Legend']];
const MISS=[
 {t:['Mua lệnh Long Call đầu tiên','Buy your first Long Call'],h:['Vào Giao dịch → Long Call → Đặt lệnh','Trade → Long Call → Place order']},
 {t:['Chốt một lệnh có lãi (sau phí)','Close a winning trade (after fees)'],h:['Vào Danh mục, đóng lệnh khi đang xanh','Go to Portfolio and close a position while it is green']},
 {t:['Mua một lệnh Long Put','Buy a Long Put'],h:['Chọn mã có tin xấu rồi mua Put','Pick a stock with bad news and buy a Put']},
 {t:['Mua 100 cổ phiếu và bán Covered Call','Buy 100 shares and sell a Covered Call'],h:['Thị trường → chạm mã → Mua 100 cp, rồi Giao dịch → Covered Call','Market → tap a stock → Buy 100 sh, then Trade → Covered Call']},
 {t:['Nhận trọn premium khi quyền chọn bán hết hạn vô giá trị','Keep the full premium when a short option expires worthless'],h:['Giữ lệnh bán đến đáo hạn, giá không chạm strike','Hold a short option to expiry without price reaching the strike']},
 {t:['Bán một Cash-Secured Put','Sell a Cash-Secured Put'],h:['Chọn strike thấp hơn giá hiện tại','Pick a strike below the current price']},
 {t:['Mở một Spread bất kỳ','Open any spread'],h:['Bull Call, Bear Put, Bull Put hoặc Bear Call','Bull Call, Bear Put, Bull Put or Bear Call']},
 {t:['Mở Long Straddle trước báo cáo lợi nhuận ≤4 ngày','Open a Long Straddle ≤4 days before earnings'],h:['Chọn kỳ hạn có dấu ⏰ — rồi xem IV xẹp sau báo cáo!','Pick an expiry marked ⏰ — then watch IV crush after the report!']},
 {t:['Chốt lãi một Iron Condor','Close an Iron Condor for a profit'],h:['Chọn mã ít biến động, đóng khi đã ăn ~50% premium','Pick a calm stock and close once you have ~50% of the premium']},
 {t:['Đạt tài sản $15,000','Reach $15,000 net worth'],h:['Đi lệnh nhỏ, đều tay','Keep position sizes small and steady']},
 {t:['Đạt tài sản $25,000','Reach $25,000 net worth'],h:['Kỷ luật là vua','Discipline is king']},

const LESS=[
 [['Quyền chọn là gì?','Là hợp đồng cho bạn QUYỀN (không bắt buộc) mua hoặc bán 100 cổ phiếu ở một mức giá định sẵn (strike) trước ngày đáo hạn. Bạn trả một khoản phí gọi là premium để có quyền đó.'],['What is an option?','A contract that gives you the RIGHT (not the obligation) to buy or sell 100 shares at a set price (the strike) before the expiration date. You pay a fee called the premium for that right.']],
 [['Call và Put','Call = quyền MUA. Giá cổ phiếu tăng thì Call tăng giá. Put = quyền BÁN. Giá cổ phiếu giảm thì Put tăng giá. Người mua lỗ tối đa bằng premium; người bán thu premium nhưng gánh nghĩa vụ.'],['Calls and Puts','Call = the right to BUY; it gains when the stock rises. Put = the right to SELL; it gains when the stock falls. Buyers can lose at most the premium; sellers collect the premium but take on the obligation.']],
 [['ITM, ATM, OTM','ITM: đang có giá trị nội tại (Call có strike dưới giá thị trường). ATM: strike sát giá. OTM: chưa có giá trị nội tại — rẻ, đòn bẩy cao nhưng dễ về 0.'],['ITM, ATM, OTM','ITM: has intrinsic value (a Call with its strike below the stock price). ATM: strike near the price. OTM: no intrinsic value yet — cheap and high-leverage, but often expires at zero.']],
 [['Bid, Ask và phí','Bạn MUA ở giá Ask và BÁN ở giá Bid. Khoảng chênh đó là chi phí ẩn: vừa mở lệnh là đã âm một chút. Mã ít thanh khoản và strike xa có chênh lệch rộng hơn. Game tính thêm phí $0.65 mỗi hợp đồng mỗi chân, mức phổ biến ở các sàn Mỹ.'],['Bid, Ask and fees','You BUY at the Ask and SELL at the Bid. That gap is a hidden cost: every new trade starts slightly red. Thinly traded stocks and far strikes have wider spreads. The game also charges $0.65 per contract per leg, a common US broker rate.']],
 [['Ngày đáo hạn','Quyền chọn cổ phiếu Mỹ thường đáo hạn vào thứ Sáu. Kỳ hạn tuần (weekly) ngắn và rẻ; kỳ hạn tháng (monthly) rơi vào thứ Sáu tuần thứ ba, thanh khoản tốt nhất. Cuối tuần thị trường nghỉ nhưng thời gian vẫn trôi.'],['Expiration dates','US stock options usually expire on Fridays. Weeklies are short and cheap; monthlies land on the third Friday and have the best liquidity. The market is closed on weekends, but time still passes.']],
 [['Theta — kẻ ăn mòn','Theta là số tiền quyền chọn mất mỗi ngày dù giá đứng im. Càng gần đáo hạn Theta càng mạnh. Người MUA trả Theta, người BÁN hưởng Theta.'],['Theta — time decay','Theta is how much an option loses each day even if the stock does not move. It speeds up near expiration. BUYERS pay theta; SELLERS collect it.']],
 [['Delta — độ nhạy theo giá','Delta 0.50 nghĩa là cổ phiếu tăng $1 thì quyền chọn tăng khoảng $0.50. Delta cũng xấp xỉ xác suất quyền chọn kết thúc ITM.'],['Delta — price sensitivity','A delta of 0.50 means the option gains about $0.50 when the stock rises $1. Delta is also a rough estimate of the odds the option finishes ITM.']],
 [['IV, IV Rank và Vega','IV (biến động ngụ ý) cao thì premium đắt. IV Rank cho biết IV hiện tại cao hay thấp so với chính nó thời gian qua: gần 100 là đắt (lợi cho người bán), gần 0 là rẻ (lợi cho người mua). Vega là số tiền quyền chọn đổi khi IV đổi 1 điểm %.'],['IV, IV Rank and Vega','High IV (implied volatility) means expensive premiums. IV Rank shows whether today\'s IV is high or low versus its own recent range: near 100 is expensive (good for sellers), near 0 is cheap (good for buyers). Vega is how much the option changes when IV moves 1 point.']],
 [['Volatility skew','Put OTM thường có IV cao hơn Call OTM vì nhà đầu tư sẵn sàng trả đắt để mua bảo hiểm giảm giá. Bạn sẽ thấy điều đó trong bảng giá: cùng khoảng cách tới giá hiện tại, Put đắt hơn Call.'],['Volatility skew','OTM Puts usually carry higher IV than OTM Calls because investors pay up for crash insurance. You can see it in the chain: at the same distance from the price, Puts cost more than Calls.']],
 [['Báo cáo lợi nhuận & "expected move"','Trước báo cáo, giá straddle ATM cho biết thị trường đang định giá cổ phiếu sẽ nhảy bao nhiêu %. Ngay sau báo cáo, phần IV "sự kiện" biến mất (IV crush). Mua quyền chọn qua báo cáo chỉ lời khi giá nhảy MẠNH HƠN mức đã định giá.'],['Earnings & the "expected move"','Before a report, the ATM straddle price tells you how big a move the market is pricing in. Right after the report the event premium vanishes (IV crush). Buying options through earnings only pays if the stock moves MORE than what was priced in.']],
 [['Vì sao lãi vượt kỳ vọng mà giá vẫn giảm?','Giá phản ứng với tương lai: dự báo (guidance) bị hạ, doanh thu hụt, hoặc cổ phiếu đã chạy mạnh trước báo cáo nên tin tốt nằm sẵn trong giá. Trong game, mỗi báo cáo có EPS, doanh thu và guidance — hãy đọc cả ba.'],['Why can a stock fall after beating earnings?','Prices react to the future: guidance gets cut, revenue misses, or the stock ran up before the report so the good news was already priced in. In the game every report shows EPS, revenue and guidance — read all three.']],
 [['Covered Call & Wheel','Giữ 100 cp và bán 1 Call OTM để thu premium đều đặn; giá vượt strike thì phải bán cp ở giá strike. Bán Cash-Secured Put để mua cp giá rẻ hơn, bị giao cp thì quay sang bán Covered Call — thành vòng "Wheel".'],['Covered Calls & the Wheel','Hold 100 shares and sell an OTM Call for steady income; above the strike you must sell your shares at the strike. Sell Cash-Secured Puts to buy shares cheaper; once assigned, switch to selling Covered Calls — that loop is "the Wheel".']],
 [['Spread — rủi ro có giới hạn','Spread trả tiền (Bull Call, Bear Put) là cược hướng với chi phí thấp. Spread thu tiền (Bull Put, Bear Call) là bán premium với lỗ tối đa biết trước. Iron Condor = Bull Put + Bear Call cùng lúc.'],['Spreads — defined risk','Debit spreads (Bull Call, Bear Put) are cheaper directional bets. Credit spreads (Bull Put, Bear Call) sell premium with a known max loss. An Iron Condor is a Bull Put and a Bear Call at the same time.']],
 [['Sự kiện vĩ mô','Fed, CPI và báo cáo việc làm làm cả thị trường rung mạnh hơn ngày thường. Cổ phiếu beta cao (chip, xe điện) rung mạnh hơn chỉ số; beta thấp (y tế, đồ ăn) rung ít hơn.'],['Macro events','Fed decisions, CPI and jobs reports shake the whole market more than a normal day. High-beta stocks (chips, EVs) swing harder than the index; low-beta ones (healthcare, food) swing less.']],
 [['Quản trị vốn','Nhiều nhà giao dịch chỉ đặt 2–5% tài khoản cho mỗi lệnh mua quyền chọn, vì một lệnh có thể mất 100%. Cháy tài khoản thường do đi lệnh quá to, không phải do sai hướng.'],['Position sizing','Many traders risk only 2–5% of the account on each long option, because any single trade can go to zero. Accounts usually blow up from oversized bets, not from being wrong on direction.']],

const cloud={st:'off',ref:null,busy:false,dirty:false,last:0,timer:0,retried:false};
const CLI={ok:'☁️✓',sync:'☁️…',off:'📱',err:'☁️✕'};
function setCloud(st){cloud.st=st;const e=$('#cl');if(e)e.textContent=CLI[st]}
function cloudQueue(){if(!cloud.ref)return;cloud.dirty=true;clearTimeout(cloud.timer);cloud.timer=setTimeout(cloudPush,1500)}
async function cloudPush(){if(!cloud.ref||cloud.busy||!cloud.dirty)return;cloud.busy=true;cloud.dirty=false;setCloud('sync');
  try{await cloud.ref.set({v:2,ts:S.ts||Date.now(),day:S.day,date:S.date,nw:Math.round(netWorth()),json:JSON.stringify(S)});cloud.last=Date.now();cloud.retried=false;setCloud('ok')}
  catch(e){if(e&&e.code==='unavailable'&&!cloud.retried){cloud.retried=true;cloud.dirty=true}else{cloud.ref=null;cloud.dirty=false;setCloud('err')}}
  cloud.busy=false;if(cloud.dirty&&cloud.ref){clearTimeout(cloud.timer);cloud.timer=setTimeout(cloudPush,1500+Math.random()*1500)}}
async function cloudInit(){const ts0=S.ts||0;let c=window.claude;
  for(let i=0;i<25&&!(c&&c.use);i++){await new Promise(r=>setTimeout(r,200));c=window.claude}
  if(!(c&&c.use))return setCloud('off');
  setCloud('sync');const to=setTimeout(()=>{if(!cloud.ref&&cloud.st==='sync')setCloud('off')},10000);
  try{const[db,user]=await Promise.all([c.use('db'),c.use('user')]);if(!db||!user)throw 0;const id=await user.id();if(!id)throw 0;
    const ref=db.doc('data/users/'+id+'/save'),snap=await ref.get();clearTimeout(to);cloud.ref=ref;
    if(snap.exists){let o=null;try{o=JSON.parse(snap.data().json)}catch(e){}
      const fresh=S.day===1&&!S.pos.length&&!Object.keys(S.sh).length&&S.xp<12,ok=o&&o.v===2&&o.st&&o.date;
      if(ok&&o.ts!==ts0&&((o.ts||0)>ts0||fresh)){S=o;ensureGame();if(S.pl&&S.pl.id){PL=S.pl;savePL()}if(S.lang==='vi'||S.lang==='en')setLang(S.lang);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
        tab='market';detail=false;T.sym='ORCD';T.strat='call';T.exp='';resetK();$('#modal').classList.remove('on');render();
        toast(L('☁️ Đã tải tiến trình từ cloud: phiên ','☁️ Progress loaded from the cloud: session ')+dfmt(S.date)+' · '+money(netWorth()),'y');setCloud('ok')}
      else if(!ok||ts0>(o.ts||0)){cloud.dirty=true;cloudPush()}else setCloud('ok')}
    else{if(!S.ts)S.ts=Date.now();cloud.dirty=true;cloudPush()}
  }catch(e){clearTimeout(to);setCloud('off')}}

function stepMarket(ev){const mk=S.mk;if(--mk.regLeft<=0){mk.drift=pick([-0.35,-0.1,0.08,0.12,0.2,0.3]);mk.regLeft=15+Math.random()*30|0}
  let z=gauss();if(Math.random()<0.03)z*=2.5;if(ev)z*=ev.k==='FED'?2.2:1.7;
  const r=mk.drift/252+mk.vol/15.87*z;
  mk.vol=clamp(mk.vol+0.12*(0.15-mk.vol)+(r<0?-r*1.6:-r*0.5)+gauss()*0.004,0.09,0.6);mk.ret=r;return r}
function earnings(s,date){const est=s.eps,sur=0.04+gauss()*0.07,rev=0.004+gauss()*0.018,dsg=Math.sign(s.drift),r=Math.random(),pr=0.28+0.2*dsg,pcut=0.2-0.12*dsg;

function advise(a){const s=S.st[T.sym],long=a.q.net>0,cov=s.earn&&T.exp>=s.earn,nw=netWorth(),pct=Math.abs(a.maxLoss)/nw*100,dte=calDays(S.date,T.exp),ivr=ivRank(s);

  g.textAlign='left';g.fillStyle='#3ddc84';g.fillText(L('LÃI','PROFIT'),8,14);g.fillStyle='#ff5d6c';g.fillText(L('LỖ','LOSS'),8,h-20)}

/* ============ hiệu ứng ============ */
function toast(t,c=''){const e=document.createElement('div');e.className='toast '+c;e.textContent=t;const box=$('#toasts');box.appendChild(e);while(box.children.length>4)box.firstChild.remove();setTimeout(()=>e.remove(),5000)}
function modal(h){const m=$('#modal');m.innerHTML='<div class="card">'+h+'</div>';m.classList.add('on')}
function shake(){const a=$('#app');a.classList.remove('shake');void a.offsetWidth;a.classList.add('shake')}
let AC;function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
function sfx(k){if(!AC)return;const seq={buy:[[520,.06],[780,.09]],win:[[660,.07],[880,.07],[1320,.14]],lose:[[300,.1],[200,.18]],tick:[[440,.04]],lvl:[[523,.09],[659,.09],[784,.09],[1047,.2]]}[k];let t=AC.currentTime;
  for(const[f,d]of seq){const o=AC.createOscillator(),g=AC.createGain();o.type=k==='lose'?'sawtooth':'triangle';o.frequency.value=f;g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d);t+=d*.8}}
let parts=[],raf=0;
function confetti(n){const c=$('#fx');c.width=innerWidth;c.height=innerHeight;for(let i=0;i<n;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*120,y:innerHeight*.3,vx:(Math.random()-.5)*11,vy:-Math.random()*11-3,r:4+Math.random()*5,c:pick(['#ffc93c','#3ddc84','#59c8ff','#ff9ecb','#fff']),a:Math.random()*6,l:1});if(!raf)raf=requestAnimationFrame(fxLoop)}
function fxLoop(){const c=$('#fx'),g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);parts=parts.filter(p=>p.l>0&&p.y<c.height+20);
  for(const p of parts){p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.a+=.2;p.l-=.012;g.save();g.translate(p.x,p.y);g.rotate(p.a);g.globalAlpha=clamp(p.l*2,0,1);g.fillStyle=p.c;g.strokeStyle='#070b22';g.lineWidth=1.5;g.fillRect(-p.r,-p.r/2,p.r*2,p.r);g.strokeRect(-p.r,-p.r/2,p.r*2,p.r);g.restore()}
  raf=parts.length?requestAnimationFrame(fxLoop):0;if(!raf)g.clearRect(0,0,c.width,c.height)}

/* ============ khởi động ============ */
S=load();if(!S)newGame('first');else ensureGame();if(S.pl&&S.pl.id&&S.pl.id!==PL.id&&!PL.name){PL=S.pl;savePL()}if(S.lang==='vi'||S.lang==='en')setLang(S.lang);else setLang(LANG);
resetK();render();
window.addEventListener('resize',()=>render());
cloudInit();
tlog('visit',{d:{ua:navigator.userAgent.slice(0,120),screen:screen.width+'x'+screen.height,lang:LANG,host:location.hostname||'file',queued:tel.q.length}});
setInterval(telFlush,20000);
if(S.intro&&SHEET_API&&!PL.name)setTimeout(()=>{if(!$('#modal').classList.contains('on'))askName(true)},600);
if(!S.intro)showIntro();
window.__game={get S(){return S},tel,get PL(){return PL},get LANG(){return LANG},T,act,netWorth,analyse,nextDay,place,level,expiries,ivAt,legQ};
